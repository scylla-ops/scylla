[package]
name = "scylla-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
# domain types (no db backend) + gRPC contract
scylla-core = { workspace = true, default-features = false }
scylla-protocol = { workspace = true }

# async
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }

# grpc
tonic = { workspace = true }

# cli
clap = { workspace = true, features = ["env"] }

# error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# time
chrono = { workspace = true }

# unix process-group signalling (kill the shell's children, not just the shell).
# Agents run on Linux; this is absent on other targets where the kill code is
# compiled out.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
