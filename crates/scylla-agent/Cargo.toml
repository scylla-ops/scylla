[package]
name = "scylla-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
# the shared kernel (domain model + JobEvent) and the wire contract. These are
# the agent's only two links to the rest of the workspace: it holds no database,
# makes no authorization decision and enforces no business rule.
scylla-core = { workspace = true }
scylla-protocol = { workspace = true }

# async
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }

# grpc — `tls-ring` + `tls-native-roots` so the agent can dial an https://
# control-plane (TLS terminated at the proxy) using the host's trust store.
tonic = { workspace = true, features = ["tls-ring", "tls-native-roots"] }
# well-known types: job log lines carry a `google.protobuf.Timestamp`
prost-types.workspace = true

# cli
clap = { workspace = true, features = ["env"] }

# error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# time
chrono = { workspace = true }

# unix process-group signalling (kill the shell's children, not just the shell).
# Agents run on Linux; this is absent on other targets where the kill code is
# compiled out.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
