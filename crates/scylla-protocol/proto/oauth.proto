syntax = "proto3";

package oauth;

import "common.proto";

// GitHub OAuth login. Both RPCs are public (no session exists yet): the
// frontend gets the authorize URL, redirects the user to GitHub, then sends the
// returned code here to obtain a session. Present only in `oauth-github` builds.
service OauthService {
  rpc GetAuthUrl(GetAuthUrlRequest) returns (GetAuthUrlResponse);
  rpc Callback(OauthCallbackRequest) returns (OauthCallbackResponse);
}

message GetAuthUrlRequest {
  string state = 1; // CSRF token, echoed back on callback by the client
}

message GetAuthUrlResponse {
  string url = 1;
}

message OauthCallbackRequest {
  string code = 1;
}

message OauthCallbackResponse {
  string token = 1;
  common.UserId user_id = 2;
  // Exactly one outcome. A first login provisions a new account (carrying its
  // fresh organization id); any later login resolves to an existing account
  // and carries no org id. Splitting these makes "new account without an org"
  // and "existing account with an org" unrepresentable.
  oneof outcome {
    NewAccount new_account = 3;
    ExistingAccount existing_account = 4;
  }
}

// First OAuth login: a brand-new account and its organization were provisioned.
message NewAccount {
  common.OrganizationId organization_id = 1;
}

// A later login that resolved to an already-existing account (matched by linked
// identity, or by email on first link). Carries no fields.
message ExistingAccount {}
