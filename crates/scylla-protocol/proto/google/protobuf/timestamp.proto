// Vendored copy of the protobuf well-known type `google.protobuf.Timestamp`.
//
// Why vendored: several of our protos import "google/protobuf/timestamp.proto",
// but neither protoc invocation ships the well-known include path reliably —
// the backend build (`tonic_prost_build`) and the frontend `gen-proto` both run
// protoc with only `-I <proto_dir>`. Placing this file under that include root
// (proto/google/protobuf/) makes the import resolve everywhere, with no Docker
// or env assumptions. It is an *include* (not in any compiler input list), so:
//   - prost maps `.google.protobuf.Timestamp` to `::prost_types::Timestamp`
//     (the mapping is by type name; no module is generated for this file), and
//   - protobuf-ts emits its own `google/protobuf/timestamp.ts` helper.
//
// Source: github.com/protocolbuffers/protobuf (Apache-2.0). Kept byte-faithful
// to the upstream message shape (seconds: int64 #1, nanos: int32 #2).

syntax = "proto3";

package google.protobuf;

option cc_enable_arenas = true;
option go_package = "google.golang.org/protobuf/types/known/timestamppb";
option java_package = "com.google.protobuf";
option java_outer_classname = "TimestampProto";
option java_multiple_files = true;
option objc_class_prefix = "GPB";
option csharp_namespace = "Google.Protobuf.WellKnownTypes";

// A Timestamp represents a point in time independent of any time zone or local
// calendar, encoded as a count of seconds and fractions of seconds at
// nanosecond resolution.
message Timestamp {
  // Represents seconds of UTC time since Unix epoch
  // 1970-01-01T00:00:00Z. Must be from 0001-01-01T00:00:00Z to
  // 9999-12-31T23:59:59Z inclusive.
  int64 seconds = 1;

  // Non-negative fractions of a second at nanosecond resolution. Negative
  // second values with fractions must still have non-negative nanos values
  // that count forward in time. Must be from 0 to 999,999,999 inclusive.
  int32 nanos = 2;
}
