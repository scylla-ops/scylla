syntax = "proto3";

package invitation;

import "common.proto";
import "google/protobuf/timestamp.proto";

// Authenticated management of org invitations (org-admins).
service InvitationService {
  rpc CreateInvite(CreateInviteRequest) returns (InvitationResponse);
  rpc ListInvites(ListInvitesRequest) returns (ListInvitesResponse);
  rpc RevokeInvite(RevokeInviteRequest) returns (RevokeInviteResponse);
}

// Public acceptance — the invite token is the credential, so this must NOT sit
// behind the auth interceptor (the invitee has no session yet).
service InvitationAcceptService {
  rpc AcceptInvite(AcceptInviteRequest) returns (AcceptInviteResponse);
}

message CreateInviteRequest {
  common.OrganizationId organization_id = 1;
  common.Email email = 2;
  optional string role = 3; // e.g. "organization-admin"; omitted = plain member
}

message InvitationResponse {
  common.InvitationId id = 1;
  common.OrganizationId organization_id = 2;
  common.Email email = 3;
  optional string role = 4;
  string status = 5;
  google.protobuf.Timestamp expires_at = 6;
}

message ListInvitesRequest {
  common.OrganizationId organization_id = 1;
}

message ListInvitesResponse {
  repeated InvitationResponse invitations = 1;
}

message RevokeInviteRequest {
  common.InvitationId invitation_id = 1;
}

message RevokeInviteResponse {}

message AcceptInviteRequest {
  string token = 1;
  string username = 2;
  string password = 3;
}

message AcceptInviteResponse {
  string token = 1;
  common.UserId user_id = 2;
  common.OrganizationId organization_id = 3;
}
