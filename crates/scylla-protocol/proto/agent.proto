syntax = "proto3";

package agent;

// Persistent bidirectional stream between the control plane and a connected
// agent App. The App authenticates with its bearer token (Authorization
// metadata) and the interceptor resolves it to an App principal. While
// connected it receives JobDispatch messages and streams back job status and
// log events. Presence is the open stream itself — no heartbeats.
// `Open` (not `Connect`) because tonic's generated client already has a
// `connect(endpoint)` constructor — a `Connect` RPC would collide with it.
service AgentService {
  rpc Open(stream AgentUp) returns (stream AgentDown);
}

// Server -> agent.
message AgentDown {
  oneof payload {
    JobDispatch dispatch = 1;
  }
}

// Agent -> server.
message AgentUp {
  oneof payload {
    JobStatus  status = 1;
    JobLogLine log    = 2;
  }
}

message JobDispatch {
  string job_id              = 1;
  string pipeline_id         = 2;
  repeated AgentNode nodes  = 3;
}

message AgentNode {
  string node_id       = 1;
  repeated string deps = 2;
  string command       = 3;
  repeated string args = 4;
}

// Mirrors the domain JobEvent: a kind plus the fields relevant to that kind.
message JobStatus {
  string       job_id  = 1;
  JobEventKind kind    = 2;
  string       node_id = 3; // set for NODE_* kinds
  string       error   = 4; // set for *_FAILED kinds
}

enum JobEventKind {
  JOB_STARTED    = 0;
  NODE_STARTED   = 1;
  NODE_COMPLETED = 2;
  NODE_FAILED    = 3;
  NODE_SKIPPED   = 4;
  JOB_COMPLETED  = 5;
  JOB_FAILED     = 6;
}

message JobLogLine {
  string job_id    = 1;
  string node_id   = 2;
  string stream    = 3; // "stdout" | "stderr"
  string line      = 4;
  string timestamp = 5; // RFC 3339
}
