syntax = "proto3";

package user;

import "common.proto";
import "google/protobuf/timestamp.proto";

service UserService {
  // Create a user
  rpc CreateUser(CreateUserRequest) returns (UserResponse);

  // Get a user by ID
  rpc GetUser(GetUserRequest) returns (UserResponse);

  // Update a user
  rpc UpdateUser(UpdateUserRequest) returns (UserResponse);

  // Delete a user
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);

  // List all users
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);

  // Change a user's global role
  rpc ChangeUserGlobalRole(ChangeUserGlobalRoleRequest)
      returns (ChangeUserGlobalRoleResponse);
}

message CreateUserRequest {
  string username = 1;
  string password = 2; // not hashed
  optional common.Email email = 3;
}

message GetUserRequest { common.UserId user_id = 1; }

message UpdateUserRequest {
  common.UserId user_id = 1;
  optional string username = 2;
}

message UserResponse {
  common.UserId user_id = 1;
  string username = 2;
  bool is_active = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  optional common.Email email = 6;
}

message DeleteUserRequest { common.UserId user_id = 1; }

message DeleteUserResponse {}

message ListUsersRequest { optional common.PaginationRequest pagination = 1; }

message ListUsersResponse {
  repeated UserResponse users = 1;
  common.PaginationMetadata pagination = 2;
}

message ChangeUserGlobalRoleRequest {
  common.UserId user_id = 1;
  string new_role = 2; // "admin" or "user"
}

message ChangeUserGlobalRoleResponse {
  common.UserId user_id = 1;
  string new_role = 2;
}