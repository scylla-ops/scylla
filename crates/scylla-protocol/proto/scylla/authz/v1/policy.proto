syntax = "proto3";

package scylla.authz.v1;

import "google/protobuf/timestamp.proto";
import "scylla/authz/v1/permission.proto";
import "scylla/common/v1/common.proto";

// Admin management of runtime Cedar authorization policies. Policies are stored
// in the database, merged with the compiled-in static policy set, validated
// against the schema on write, and applied to the live authorizer atomically
// (hot-reload — no restart). All RPCs require the `managePolicies` permission.
service PolicyService {
  rpc CreatePolicy(CreatePolicyRequest) returns (CreatePolicyResponse);
  rpc UpdatePolicy(UpdatePolicyRequest) returns (UpdatePolicyResponse);
  rpc SetPolicyEnabled(SetPolicyEnabledRequest) returns (SetPolicyEnabledResponse);
  rpc DeletePolicy(DeletePolicyRequest) returns (DeletePolicyResponse);
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);
  // Dry-run: parse + typecheck a candidate without persisting it.
  rpc ValidatePolicy(ValidatePolicyRequest) returns (ValidatePolicyResponse);
  // The authorization vocabulary a policy may reference: every permission (with
  // the resource type it applies to). Read-only — lets an author/UI enumerate
  // real permissions instead of guessing names.
  rpc ListAuthzVocabulary(ListAuthzVocabularyRequest) returns (ListAuthzVocabularyResponse);
}

// One runtime Cedar policy.
message Policy {
  scylla.common.v1.PolicyId policy_id = 1;
  string description = 2;
  // Cedar source.
  string text = 3;
  bool enabled = 4;
  // Free-form audit label for the actor that created the policy: a user id, or
  // the name of the internal service that seeded it. Display only — never parse it.
  string created_by = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message CreatePolicyRequest {
  string description = 1;
  string text = 2;
}

message CreatePolicyResponse { Policy policy = 1; }

message UpdatePolicyRequest {
  scylla.common.v1.PolicyId policy_id = 1;
  optional string description = 2;
  optional string text = 3;
}

message UpdatePolicyResponse { Policy policy = 1; }

message SetPolicyEnabledRequest {
  scylla.common.v1.PolicyId policy_id = 1;
  bool enabled = 2;
}

message SetPolicyEnabledResponse { Policy policy = 1; }

message DeletePolicyRequest { scylla.common.v1.PolicyId policy_id = 1; }

message DeletePolicyResponse {}

message ListPoliciesRequest {}

message ListPoliciesResponse { repeated Policy policies = 1; }

message ValidatePolicyRequest { string text = 1; }

// The verdict on a candidate policy. A oneof rather than `bool valid` plus an
// `optional error`, so "valid but carrying an error" cannot be built.
message ValidatePolicyResponse {
  oneof result {
    Valid valid = 1;
    Invalid invalid = 2;
  }

  // Parses and typechecks against the schema.
  message Valid {}
  // Rejected, with the parser/typechecker diagnostic.
  message Invalid { string error = 1; }
}

message ListAuthzVocabularyRequest {}

message ListAuthzVocabularyResponse { repeated AuthzAction actions = 1; }
