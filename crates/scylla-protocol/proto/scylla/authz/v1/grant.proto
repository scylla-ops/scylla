syntax = "proto3";

package scylla.authz.v1;

import "scylla/authz/v1/permission.proto";
import "scylla/common/v1/common.proto";

// Scoped grants — an explicit "principal holds role within scope" assignment,
// linked as a Cedar template instance. Applied live (hot-reload). Requires the
// scope-appropriate manage-grants permission (manageSystemGrants /
// manageOrgGrants / manageProjectGrants).
service GrantService {
  rpc CreateGrant(CreateGrantRequest) returns (CreateGrantResponse);
  rpc RevokeGrant(RevokeGrantRequest) returns (RevokeGrantResponse);
  rpc ListGrants(ListGrantsRequest) returns (ListGrantsResponse);
  // The static catalog of roles assignable via CreateGrant. The optional
  // scope_kind filter narrows to roles valid on that scope kind (e.g. PROJECT →
  // project-admin, project-agent).
  rpc ListGrantableRoles(ListGrantableRolesRequest) returns (ListGrantableRolesResponse);
}

message Grant {
  scylla.common.v1.GrantId grant_id = 1;
  // Who holds it — a user or a machine app.
  PrincipalRef principal = 2;
  // Where it applies, carrying the bound entity.
  ScopeRef scope = 3;
  // The role granted within that scope. Anything narrower than a role is
  // expressed by creating a role with exactly the permissions wanted.
  scylla.common.v1.RoleId role = 4;
  // 5 was a direct single-permission target, dropped when the grant target
  // collapsed to a role. Never reuse the number.
  reserved 5;
}

message CreateGrantRequest {
  PrincipalRef principal = 1;
  ScopeRef scope = 2;
  // The role to grant. It must exist and declare the scope kind this grant binds
  // to; it also goes through the anti-escalation check.
  scylla.common.v1.RoleId role = 3;
  reserved 4;
}

message CreateGrantResponse { Grant grant = 1; }

message RevokeGrantRequest { scylla.common.v1.GrantId grant_id = 1; }

message RevokeGrantResponse {}

message ListGrantsRequest {
  // Optional scope filter. Set → list the grants bound to exactly that scope
  // (manageable by an org/project admin of it). Unset → list every grant
  // (system admins only).
  optional ScopeRef scope = 1;
}

message ListGrantsResponse { repeated Grant grants = 1; }

message ListGrantableRolesRequest {
  // Optional: narrow to roles assignable on this scope kind.
  optional ScopeKind scope_kind = 1;
}

// Whether a grantable role confers full control of its scope or a restricted
// capability set. Closed and code-owned — the catalog is compiled in.
enum RoleKind {
  ROLE_KIND_UNSPECIFIED = 0;
  // Full control over the scope it is granted on.
  ROLE_KIND_ADMIN = 1;
  // A restricted capability set (e.g. an agent that may only execute jobs).
  ROLE_KIND_AGENT = 2;
}

// A role that may be assigned through a grant. The catalog is compiled in, so
// this list is exhaustive and never grows at runtime.
message GrantableRole {
  // The value CreateGrant references, e.g. "organization-admin". Builtin role
  // ids are their stable keys, so this doubles as the display name.
  scylla.common.v1.RoleId role_id = 1;
  // The scope kind a grant of this role must bind to.
  ScopeKind scope_kind = 2;
  RoleKind kind = 3;
  string description = 4;
}

message ListGrantableRolesResponse { repeated GrantableRole roles = 1; }
