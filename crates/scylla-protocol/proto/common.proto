syntax = "proto3";

package common;

// Shared, strongly-typed value objects used across every Scylla service. They
// exist so a client (frontend or otherwise) cannot accidentally pass a
// ProjectId where an OrganizationId is expected, and so the exact format of each
// value is documented in one place rather than guessed from a bare `string`.
//
// Each id wraps a single `value`. Unless noted, an id is a **lowercase ULID**
// (Crockford base32, 26 chars, e.g. `01hb2k...`): opaque, lexicographically
// sortable by creation time, case-sensitive — treat it as a token, do not parse
// or upper-case it. Timestamps use the well-known `google.protobuf.Timestamp`.

// Identifies a user account.
message UserId { string value = 1; }
// Identifies an organization (top-level tenant).
message OrganizationId { string value = 1; }
// Identifies a project (a unit of work inside an organization).
message ProjectId { string value = 1; }
// Identifies a pipeline (a DAG blueprint inside a project).
message PipelineId { string value = 1; }
// Identifies a job (one execution of a pipeline).
message JobId { string value = 1; }
// Identifies a single job log line.
message JobLogId { string value = 1; }
// Identifies an app — a machine principal owned by an organization.
message AppId { string value = 1; }
// Identifies an app secret (a hashed credential belonging to an app).
message AppSecretId { string value = 1; }
// Identifies an organization invitation.
message InvitationId { string value = 1; }
// Identifies one node within a pipeline. NOT a ULID: a caller-supplied id,
// unique within its pipeline, lowercase ASCII alphanumeric plus `-`/`_`, ≤128
// chars.
message NodeId { string value = 1; }

// An email address. Validated (RFC-5322-ish) and stored lowercased on write.
message Email { string value = 1; }

// How a ScriptStep's script is interpreted. The agent runs the script through
// the named shell with fail-fast semantics. SHELL_UNSPECIFIED is treated as sh.
enum Shell {
  SHELL_UNSPECIFIED = 0; // treated as SHELL_SH
  SHELL_SH          = 1; // POSIX /bin/sh — always present in the agent image
  SHELL_BASH        = 2; // /bin/bash — requires bash in the agent base image
}

// A direct process execution: `command` is resolved via PATH and `args` is a
// literal argv vector (never word-split). No shell is involved, so nothing is
// interpolated — deterministic and injection-proof.
message ExecStep {
  string command = 1;
  repeated string args = 2;
}

// A shell script run via the chosen shell. The whole (possibly multi-line)
// script is the unit of execution; the shell parses quoting, pipes, globs,
// redirects and `$VAR` expansion.
message ScriptStep {
  string script = 1;
  Shell  shell  = 2;
}

// Pagination request parameters
message PaginationRequest {
  // Page number (1-indexed, defaults to 1)
  uint32 page = 1;
  // Number of items per page (defaults to 20, max 100)
  uint32 page_size = 2;
}

// Pagination metadata included in list responses
message PaginationMetadata {
  // Total number of items across all pages
  uint32 total_count = 1;
  // Current page number (1-indexed)
  uint32 page = 2;
  // Number of items per page
  uint32 page_size = 3;
  // Total number of pages
  uint32 total_pages = 4;
  // Whether there is a next page
  bool has_next = 5;
  // Whether there is a previous page
  bool has_previous = 6;
}
