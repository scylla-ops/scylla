syntax = "proto3";

package agent_admin;

// Management + introspection of Agents — specialized Apps that run jobs.
// Creating a agent provisions an App credential under the hood (the secret is
// returned exactly once) plus its agent grant. Distinct from the streaming
// `agent.AgentService` (the agent ↔ control-plane job stream): this service is
// the unary control surface used by the dashboard. Authorization is org-scoped:
// the caller must hold the matching agent permission on the org / agent.
service AgentAdminService {
  rpc CreateAgent(CreateAgentRequest)     returns (CreatedAgent);
  rpc ListAgents(ListAgentsRequest)       returns (ListAgentsResponse);
  rpc GetAgent(GetAgentRequest)           returns (AgentView);
  rpc GetAgentStats(GetAgentStatsRequest) returns (AgentStats);
  rpc DeleteAgent(DeleteAgentRequest)     returns (DeleteAgentResponse);
}

// A agent: its backing app identity plus live presence and durable last-seen.
// The id is the agent's app id (== jobs.agent_app_id).
message AgentView {
  string id              = 1;
  string organization_id = 2;
  string name            = 3;
  bool   is_active       = 4;
  string created_at      = 5; // RFC 3339
  string updated_at      = 6; // RFC 3339
  // True while an agent currently holds an open agent stream for this agent.
  // Derived live from the agent registry, not stored.
  bool   connected       = 7;
  // Last activity timestamp; empty if the agent has never connected.
  string last_seen       = 8; // RFC 3339 or ""
}

// Aggregate run stats for a agent, derived from the jobs it executed.
message AgentStats {
  int64  total       = 1;
  int64  pending     = 2;
  int64  running     = 3;
  int64  completed   = 4;
  int64  failed      = 5;
  int64  cancelled   = 6;
  string last_run_at = 7; // RFC 3339 or ""
}

message CreateAgentRequest {
  string organization_id = 1;
  string name            = 2;
}

// The newly created agent plus its plaintext secret, shown exactly once.
message CreatedAgent {
  AgentView agent = 1;
  string     secret = 2;
}

message ListAgentsRequest {
  string organization_id = 1;
}

message ListAgentsResponse {
  repeated AgentView agents = 1;
}

message GetAgentRequest {
  string id = 1;
}

message GetAgentStatsRequest {
  string id = 1;
}

message DeleteAgentRequest {
  string id = 1;
}

message DeleteAgentResponse {
  bool deleted = 1;
}
