syntax = "proto3";

package permission;

import "common.proto";
import "google/protobuf/timestamp.proto";

// Every authorization permission Scylla enforces — the atomic capability a role
// or a direct grant confers. Closed, code-owned: one value per real enforced
// capability, mirroring the backend `Permission` enum. Strongly typed so a
// client can build a permission matrix / "can I do X" check without guessing
// string names. Append-only: never renumber, add new values at the end.
enum Permission {
  PERMISSION_UNSPECIFIED = 0;
  CREATE_USER = 1;
  READ_USER = 2;
  UPDATE_USER = 3;
  DELETE_USER = 4;
  LIST_USERS = 5;
  CREATE_ORGANIZATION = 6;
  READ_ORGANIZATION = 7;
  UPDATE_ORGANIZATION = 8;
  DELETE_ORGANIZATION = 9;
  LIST_ORGANIZATIONS = 10;
  LIST_ORGANIZATION_MEMBERS = 11;
  ADD_ORGANIZATION_MEMBER = 12;
  REMOVE_ORGANIZATION_MEMBER = 13;
  MANAGE_INVITATIONS = 14;
  LIST_USER_ORGANIZATIONS = 15;
  CREATE_PROJECT = 16;
  READ_PROJECT = 17;
  UPDATE_PROJECT = 18;
  DELETE_PROJECT = 19;
  LIST_PROJECTS = 20;
  LIST_PROJECTS_BY_ORGANIZATION = 21;
  LIST_PROJECT_MEMBERS = 22;
  ADD_PROJECT_MEMBER = 23;
  REMOVE_PROJECT_MEMBER = 24;
  LIST_USER_PROJECTS = 25;
  CREATE_PIPELINE = 26;
  READ_PIPELINE = 27;
  UPDATE_PIPELINE = 28;
  DELETE_PIPELINE = 29;
  RUN_PIPELINE = 30;
  EXECUTE_JOB = 31;
  LIST_PIPELINES = 32;
  LIST_PIPELINES_BY_PROJECT = 33;
  LIST_PIPELINES_BY_ORGANIZATION = 34;
  CREATE_JOB = 35;
  READ_JOB = 36;
  UPDATE_JOB = 37;
  DELETE_JOB = 38;
  LIST_JOBS = 39;
  LIST_JOBS_BY_PIPELINE = 40;
  LIST_JOBS_BY_PROJECT = 41;
  LIST_JOBS_BY_ORGANIZATION = 42;
  READ_JOB_LOGS = 43;
  WRITE_JOB_LOGS = 44;
  WRITE_JOB_STATUS = 45;
  APPEND_JOB_LOG = 46;
  CREATE_APP = 47;
  READ_APP = 48;
  // Run stats of an app (an agent reports its job-execution stats this way).
  READ_APP_STATS = 49;
  DELETE_APP = 50;
  LIST_APPS_BY_ORGANIZATION = 51;
  CREATE_AGENT = 52;
  LIST_AGENTS = 53;
  MANAGE_SYSTEM_GRANTS = 54;
  MANAGE_ORG_GRANTS = 55;
  MANAGE_PROJECT_GRANTS = 56;
  MANAGE_POLICIES = 57;
  MANAGE_ROLES = 58;
}

// Where an authorization applies — the tenancy level. SYSTEM is the root of the
// tree (org ∈ System), so a grant there covers everything beneath.
enum Scope {
  SCOPE_UNSPECIFIED = 0;
  SCOPE_SYSTEM = 1;
  SCOPE_ORGANIZATION = 2;
  SCOPE_PROJECT = 3;
}

// Whether a principal is a human user or a machine app.
enum PrincipalKind {
  PRINCIPAL_KIND_UNSPECIFIED = 0;
  PRINCIPAL_KIND_USER = 1;
  PRINCIPAL_KIND_APP = 2;
}

// Admin management of runtime Cedar authorization policies. Policies are stored
// in the database, merged with the compiled-in static policy set, validated
// against the schema on write, and applied to the live authorizer atomically
// (hot-reload — no restart). All RPCs require the `managePolicies` permission.
service PolicyService {
  rpc CreatePolicy(CreatePolicyRequest) returns (PolicyResponse);
  rpc UpdatePolicy(UpdatePolicyRequest) returns (PolicyResponse);
  rpc SetPolicyEnabled(SetPolicyEnabledRequest) returns (PolicyResponse);
  rpc DeletePolicy(DeletePolicyRequest) returns (DeletePolicyResponse);
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);
  // Dry-run: parse + typecheck a candidate without persisting it.
  rpc ValidatePolicy(ValidatePolicyRequest) returns (ValidatePolicyResponse);
  // The authorization vocabulary a policy may reference: every permission (with
  // the resource type it applies to) and the set of resource types. Read-only —
  // lets an author/UI enumerate real permissions instead of guessing names.
  rpc ListAuthzVocabulary(ListAuthzVocabularyRequest) returns (ListAuthzVocabularyResponse);
}

message Policy {
  // Opaque Cedar policy id.
  string id = 1;
  string description = 2;
  string text = 3; // Cedar source
  bool enabled = 4;
  // User id or internal service name that created the policy.
  string created_by = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message CreatePolicyRequest {
  string description = 1;
  string text        = 2;
}

message UpdatePolicyRequest {
  string          id          = 1;
  optional string description = 2;
  optional string text        = 3;
}

message SetPolicyEnabledRequest {
  string id      = 1;
  bool   enabled = 2;
}

message DeletePolicyRequest {
  string id = 1;
}

message DeletePolicyResponse {
  bool deleted = 1;
}

message ListPoliciesRequest {}

message ListPoliciesResponse {
  repeated Policy policies = 1;
}

message PolicyResponse {
  Policy policy = 1;
}

message ValidatePolicyRequest {
  string text = 1;
}

message ValidatePolicyResponse {
  bool            valid = 1;
  optional string error = 2;
}

message ListAuthzVocabularyRequest {}

// One entry of the permission vocabulary: a permission and the broadest scope at
// which it is coherent.
message AuthzAction {
  Permission permission = 1;
  // The minimal (narrowest) scope a role may bind to and still have this
  // permission do something — i.e. the scope whose subtree contains the target
  // resource. The permission is usable in a role scoped at `min_scope` or any
  // broader (ancestor) scope. Lets a client grey out incoherent permissions per
  // role scope (e.g. createOrganization → SCOPE_SYSTEM only).
  Scope      min_scope  = 2;
}

message ListAuthzVocabularyResponse {
  repeated AuthzAction actions = 1;
}

// ── Scoped grants ────────────────────────────────────────────────────────
// An explicit "user holds role within scope" assignment, linked as a Cedar
// template instance. Applied live (hot-reload). Requires the scope-appropriate
// manage-grants permission (manageSystemGrants / manageOrgGrants / manageProjectGrants).

service GrantService {
  rpc CreateGrant(CreateGrantRequest) returns (Grant);
  rpc RevokeGrant(RevokeGrantRequest) returns (RevokeGrantResponse);
  rpc ListGrants(ListGrantsRequest)   returns (ListGrantsResponse);
  // The static catalog of roles assignable via CreateGrant. Optional scope_kind
  // filter narrows to roles valid on that scope (e.g. PROJECT → project-admin,
  // project-agent).
  rpc ListGrantableRoles(ListGrantableRolesRequest) returns (ListGrantableRolesResponse);
}

message Grant {
  string         id       = 1;
  common.UserId  user_id  = 2;
  // Role id (== key for builtins), e.g. "organization-admin". Empty for a
  // permission grant (see `permission`).
  string         role     = 3;
  Scope          scope    = 4;
  // The org/project id the grant is bound to; ignored for SCOPE_SYSTEM.
  string         scope_id = 5;
  // Set instead of `role` when this is a direct single-permission grant.
  optional Permission permission = 6;
}

message CreateGrantRequest {
  common.UserId user_id  = 1;
  // The role to grant. Used unless `permission` is set.
  string        role     = 2;
  Scope         scope    = 3;
  string        scope_id = 4;
  // Set to grant a SINGLE permission instead of a role (additive to the user's
  // roles, e.g. "Alice may runPipeline within Org A"). When set, `role` is
  // ignored. Subject to the same anti-escalation rule as a role grant.
  optional Permission permission = 5;
}

message RevokeGrantRequest {
  string id = 1;
}

message RevokeGrantResponse {
  bool revoked = 1;
}

message ListGrantsRequest {
  // Optional scope filter. Set → list grants bound to that scope (manageable by
  // an org/project admin of it). Unset → list every grant (system admins only).
  optional Scope  scope    = 1;
  optional string scope_id = 2;
}

message ListGrantsResponse {
  repeated Grant grants = 1;
}

message ListGrantableRolesRequest {
  // Optional: narrow to roles assignable on this scope kind.
  optional Scope scope = 1;
}

// A role that may be assigned through a grant.
message GrantableRole {
  string name        = 1; // e.g. "organization-admin"
  Scope  scope       = 2; // the scope kind it must be granted on
  string kind        = 3; // "admin" (full control) | "agent" (restricted)
  string description = 4;
}

message ListGrantableRolesResponse {
  repeated GrantableRole roles = 1;
}

// ── Roles ────────────────────────────────────────────────────────────────
// CRUD for the dynamic role catalog — a role is a named, editable bundle of
// permissions bound to a scope kind. All RPCs require `manageRoles` (system).
// A change is applied live (hot-reload), so editing a role's permissions
// re-authorizes everyone who holds it on the next request.

service RoleService {
  rpc CreateRole(CreateRoleRequest) returns (Role);
  rpc UpdateRole(UpdateRoleRequest) returns (Role);
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse);
  rpc ListRoles(ListRolesRequest)   returns (ListRolesResponse);
  rpc GetRole(GetRoleRequest)       returns (Role);
  // "What can this principal do" — the principal's resolved permissions grouped
  // by the scope each grant binds to. Backs a permission matrix. Requires
  // `manageSystemGrants`.
  rpc GetEffectivePermissions(GetEffectivePermissionsRequest)
      returns (GetEffectivePermissionsResponse);
}

message Role {
  // Opaque role id — the value a grant references. For builtins, equals `key`.
  string id = 1;
  // Stable key, set only for builtin roles (e.g. "organization-admin").
  optional string key = 2;
  string name = 3;
  string description = 4;
  // The scope kind a grant of this role must bind to.
  Scope scope = 5;
  bool builtin = 6;
  // Full control: the role confers every permission within the grant's scope.
  // When true, `permissions` is empty.
  bool full_control = 7;
  // The role's explicit permission set (when not full_control).
  repeated Permission permissions = 8;
}

message CreateRoleRequest {
  string name = 1;
  string description = 2;
  Scope scope = 3;
  bool full_control = 4;
  repeated Permission permissions = 5;
}

// Replaces the role's name, description and permission set wholesale (PUT-style).
// A role's scope kind and builtin status are immutable.
message UpdateRoleRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  bool full_control = 4;
  repeated Permission permissions = 5;
}

message DeleteRoleRequest { string id = 1; }
message DeleteRoleResponse { bool deleted = 1; }

message ListRolesRequest {}
message ListRolesResponse { repeated Role roles = 1; }

message GetRoleRequest { string id = 1; }

message GetEffectivePermissionsRequest {
  PrincipalKind principal_kind = 1;
  string        principal_id   = 2;
}

// The permissions a principal holds at one scope (roles expanded + direct
// permission grants), as resolved for the matrix.
message EffectiveScope {
  Scope  scope    = 1;
  // The org/project id the grants are bound to; empty for SCOPE_SYSTEM.
  string scope_id = 2;
  // Full control: the principal holds every permission within this scope
  // (`permissions` is then empty).
  bool   full_control = 3;
  repeated Permission permissions = 4;
}

message GetEffectivePermissionsResponse {
  repeated EffectiveScope scopes = 1;
}
