syntax = "proto3";

package permission;

// Admin management of runtime Cedar authorization policies. Policies are stored
// in the database, merged with the compiled-in static policy set, validated
// against the schema on write, and applied to the live authorizer atomically
// (hot-reload — no restart). All RPCs require the `managePolicies` permission.
service PolicyService {
  rpc CreatePolicy(CreatePolicyRequest) returns (PolicyResponse);
  rpc UpdatePolicy(UpdatePolicyRequest) returns (PolicyResponse);
  rpc SetPolicyEnabled(SetPolicyEnabledRequest) returns (PolicyResponse);
  rpc DeletePolicy(DeletePolicyRequest) returns (DeletePolicyResponse);
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);
  // Dry-run: parse + typecheck a candidate without persisting it.
  rpc ValidatePolicy(ValidatePolicyRequest) returns (ValidatePolicyResponse);
  // The authorization vocabulary a policy may reference: every action id (with
  // the resource type it applies to) and the set of resource types. Read-only,
  // derived from the compiled-in schema — lets an author write a permit/forbid
  // against real actions instead of guessing names.
  rpc ListAuthzVocabulary(ListAuthzVocabularyRequest) returns (ListAuthzVocabularyResponse);
}

message Policy {
  string id          = 1;
  string description = 2;
  string text        = 3; // Cedar source
  bool   enabled     = 4;
  string created_by  = 5;
  string created_at  = 6; // RFC 3339
  string updated_at  = 7; // RFC 3339
}

message CreatePolicyRequest {
  string description = 1;
  string text        = 2;
}

message UpdatePolicyRequest {
  string          id          = 1;
  optional string description = 2;
  optional string text        = 3;
}

message SetPolicyEnabledRequest {
  string id      = 1;
  bool   enabled = 2;
}

message DeletePolicyRequest {
  string id = 1;
}

message DeletePolicyResponse {
  bool deleted = 1;
}

message ListPoliciesRequest {}

message ListPoliciesResponse {
  repeated Policy policies = 1;
}

message PolicyResponse {
  Policy policy = 1;
}

message ValidatePolicyRequest {
  string text = 1;
}

message ValidatePolicyResponse {
  bool            valid = 1;
  optional string error = 2;
}

message ListAuthzVocabularyRequest {}

// One entry of the action vocabulary: the Cedar action id and the resource type
// it applies to (the `Scylla::<Type>` a policy targets for that action).
message AuthzAction {
  string id            = 1; // e.g. "runPipeline"
  string resource_type = 2; // e.g. "pipeline"
}

message ListAuthzVocabularyResponse {
  repeated AuthzAction actions        = 1;
  repeated string      resource_types = 2; // e.g. ["system","organization",…]
}

// ── Scoped grants ────────────────────────────────────────────────────────
// An explicit "user holds role within scope" assignment, linked as a Cedar
// template instance. Applied live (hot-reload). Requires `manageGrants`.

enum GrantScopeKind {
  GRANT_SCOPE_ORGANIZATION = 0;
  GRANT_SCOPE_PROJECT      = 1;
  // Global scope: a grant on the System root. A `system-admin` grant here is the
  // unified replacement for the former global role — System is the top of the
  // tenancy tree (org ∈ System), so it covers everything beneath. scope_id is
  // ignored for SYSTEM (there is a single System root).
  GRANT_SCOPE_SYSTEM       = 2;
}

service GrantService {
  rpc CreateGrant(CreateGrantRequest) returns (Grant);
  rpc RevokeGrant(RevokeGrantRequest) returns (RevokeGrantResponse);
  rpc ListGrants(ListGrantsRequest)   returns (ListGrantsResponse);
  // The static catalog of roles assignable via CreateGrant. Read-only, no DB —
  // there are no runtime-defined roles. Optional scope_kind filter narrows to
  // roles valid on that scope (e.g. PROJECT → project-admin, project-agent).
  rpc ListGrantableRoles(ListGrantableRolesRequest) returns (ListGrantableRolesResponse);
}

message Grant {
  string         id         = 1;
  string         user_id    = 2;
  string         role       = 3;
  GrantScopeKind scope_kind = 4;
  string         scope_id   = 5;
}

message CreateGrantRequest {
  string         user_id    = 1;
  string         role       = 2;
  GrantScopeKind scope_kind = 3;
  string         scope_id   = 4;
}

message RevokeGrantRequest {
  string id = 1;
}

message RevokeGrantResponse {
  bool revoked = 1;
}

message ListGrantsRequest {
  // Optional scope filter. Set → list grants bound to that scope (manageable by
  // an org/project admin of it). Unset → list every grant (system admins only).
  optional GrantScopeKind scope_kind = 1;
  optional string         scope_id   = 2;
}

message ListGrantsResponse {
  repeated Grant grants = 1;
}

message ListGrantableRolesRequest {
  // Optional: narrow to roles assignable on this scope kind.
  optional GrantScopeKind scope_kind = 1;
}

// A role that may be assigned through a grant.
message GrantableRole {
  string         name        = 1; // e.g. "organization-admin"
  GrantScopeKind scope_kind  = 2; // the scope kind it must be granted on
  string         kind        = 3; // "admin" (full control) | "agent" (restricted)
  string         description = 4;
}

message ListGrantableRolesResponse {
  repeated GrantableRole roles = 1;
}

// NOTE: the former `RoleService` (global role assignment via the `user_roles`
// table) has been removed. A "global role" is now just a grant on the System
// scope — use GrantService.CreateGrant(user, "system-admin", GRANT_SCOPE_SYSTEM).
