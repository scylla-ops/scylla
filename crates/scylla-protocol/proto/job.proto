syntax = "proto3";

package job;

import "common.proto";
import "google/protobuf/timestamp.proto";

service JobService {
  rpc GetJob(GetJobRequest) returns (JobResponse);
  rpc DeleteJob(DeleteJobRequest) returns (DeleteJobResponse);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc ListPipelineJobs(ListPipelineJobsRequest) returns (ListJobsResponse);
  rpc ListProjectJobs(ListProjectJobsRequest) returns (ListJobsResponse);
  rpc ListOrganizationJobs(ListOrganizationJobsRequest) returns (ListJobsResponse);
  rpc ListJobLogs(ListJobLogsRequest) returns (ListJobLogsResponse);
  rpc TailJobLogs(TailJobLogsRequest) returns (stream JobLogEvent);
}

message JobNodeResponse {
  common.NodeId node_id = 1;
  string state = 2;
  google.protobuf.Timestamp started_at = 3;
  google.protobuf.Timestamp finished_at = 4;
}

// Provenance of a run, mirroring the domain `JobOrigin` closed union. Each arm
// carries the ids needed to trace the initiator. `Human`/`App` = a direct
// RunPipeline call by a user / machine principal; `Cron`/`Webhook` = a trigger
// that fired (the run executes as the org's trigger-runner App, but the origin
// is the trigger).
message HumanOrigin   { string user_id = 1; }
message AppOrigin     { string app_id = 1; }
message CronOrigin    { string trigger_id = 1; }
message WebhookOrigin {
  string trigger_id = 1;
  string delivery_id = 2; // empty when the sender supplied none
}

message JobResponse {
  common.JobId job_id = 1;
  common.PipelineId pipeline_id = 2;
  string status = 3;
  repeated JobNodeResponse node_executions = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp finished_at = 8;
  // How this run was initiated. Always set.
  oneof origin {
    HumanOrigin   human   = 9;
    AppOrigin     app     = 10;
    CronOrigin    cron    = 11;
    WebhookOrigin webhook = 12;
  }
}

message GetJobRequest {
  common.JobId job_id = 1;
}

message DeleteJobRequest {
  common.JobId job_id = 1;
}

message DeleteJobResponse {}

message ListJobsRequest {
  optional common.PaginationRequest pagination = 1;
}

message ListJobsResponse {
  repeated JobResponse jobs = 1;
  common.PaginationMetadata pagination = 2;
}

message ListPipelineJobsRequest {
  common.PipelineId pipeline_id = 1;
  optional common.PaginationRequest pagination = 2;
}

message ListProjectJobsRequest {
  common.ProjectId project_id = 1;
  optional common.PaginationRequest pagination = 2;
}

message ListOrganizationJobsRequest {
  common.OrganizationId organization_id = 1;
  optional common.PaginationRequest pagination = 2;
}

message JobLogEntry {
  common.JobLogId id = 1;
  common.JobId job_id = 2;
  common.NodeId node_id = 3;
  string stream = 4;
  string line = 5;
  google.protobuf.Timestamp timestamp = 6;
}

message ListJobLogsRequest {
  common.JobId job_id = 1;
  optional common.NodeId node_id = 2;
  optional common.PaginationRequest pagination = 3;
}

message ListJobLogsResponse {
  repeated JobLogEntry logs = 1;
  common.PaginationMetadata pagination = 2;
}

message TailJobLogsRequest {
  common.JobId job_id = 1;
  optional common.NodeId node_id = 2;
}

message JobLogEvent {
  JobLogEntry log = 1;
}
