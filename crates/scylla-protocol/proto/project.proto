syntax = "proto3";

package project;

import "common.proto";
import "google/protobuf/timestamp.proto";

service ProjectService {
  // Create a project
  rpc CreateProject(CreateProjectRequest) returns (ProjectResponse);

  // Get a project by ID
  rpc GetProject(GetProjectRequest) returns (ProjectResponse);

  // Update a project
  rpc UpdateProject(UpdateProjectRequest) returns (ProjectResponse);

  // Toggle a project active state
  rpc ToggleProjectActive(ToggleProjectActiveRequest)
      returns (ToggleProjectActiveResponse);

  // Delete a project
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);

  // List all projects
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);

  // List projects for an organization
  rpc ListOrganizationProjects(ListOrganizationProjectsRequest) returns (ListProjectsResponse);

  // List users in a project
  rpc ListProjectUsers(ListProjectUsersRequest)
      returns (ListProjectUsersResponse);

  // List projects for a user
  rpc ListUserProjects(ListUserProjectsRequest) returns (ListProjectsResponse);

  // Add a user to a project
  rpc AddUserToProject(AddUserToProjectRequest)
      returns (AddUserToProjectResponse);

  // Remove a user from a project
  rpc RemoveUserFromProject(RemoveUserFromProjectRequest)
      returns (RemoveUserFromProjectResponse);
}

message CreateProjectRequest {
  string name = 1;
  optional string description = 2;
  common.OrganizationId organization_id = 3;
}

message GetProjectRequest { common.ProjectId project_id = 1; }

message UpdateProjectRequest {
  common.ProjectId project_id = 1;
  optional string name = 2;
  optional string description = 3;
}

message ProjectResponse {
  common.ProjectId project_id = 1;
  string name = 2;
  string description = 3;
  common.OrganizationId organization_id = 4;
  bool is_active = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message ToggleProjectActiveRequest { common.ProjectId project_id = 1; }

message ToggleProjectActiveResponse {}

message DeleteProjectRequest { common.ProjectId project_id = 1; }

message DeleteProjectResponse {}

message ListProjectsRequest {
  optional common.PaginationRequest pagination = 1;
}

message ListOrganizationProjectsRequest {
  common.OrganizationId organization_id = 1;
  optional common.PaginationRequest pagination = 2;
}

message ListProjectsResponse {
  repeated ProjectResponse projects = 1;
  common.PaginationMetadata pagination = 2;
}

message ListProjectUsersRequest {
  common.ProjectId project_id = 1;
  optional common.PaginationRequest pagination = 2;
}

message ProjectUserInfoResponse {
  common.UserId user_id = 1;
  string username = 2;
}

message ListProjectUsersResponse {
  repeated ProjectUserInfoResponse users = 1;
  common.PaginationMetadata pagination = 2;
}

message ListUserProjectsRequest {
  common.UserId user_id = 1;
  optional common.PaginationRequest pagination = 2;
}

message ListUserProjectsResponse {
  repeated ProjectResponse projects = 1;
  common.PaginationMetadata pagination = 2;
}

message AddUserToProjectRequest {
  common.UserId user_id = 1;
  common.ProjectId project_id = 2;
}

message AddUserToProjectResponse {}

message RemoveUserFromProjectRequest {
  common.UserId user_id = 1;
  common.ProjectId project_id = 2;
}

message RemoveUserFromProjectResponse {}
