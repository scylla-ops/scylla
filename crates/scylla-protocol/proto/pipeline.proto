syntax = "proto3";

package pipeline;

import "common.proto";
import "job.proto";
import "google/protobuf/timestamp.proto";

service PipelineService {
  rpc CreatePipeline(CreatePipelineRequest) returns (PipelineResponse);
  rpc GetPipeline(GetPipelineRequest) returns (PipelineResponse);
  rpc UpdatePipeline(UpdatePipelineRequest) returns (PipelineResponse);
  rpc DeletePipeline(DeletePipelineRequest) returns (DeletePipelineResponse);
  rpc ListPipelines(ListPipelinesRequest) returns (ListPipelinesResponse);
  rpc ListProjectPipelines(ListProjectPipelinesRequest) returns (ListPipelinesResponse);
  rpc ListOrganizationPipelines(ListOrganizationPipelinesRequest) returns (ListPipelinesResponse);
  rpc RunPipeline(RunPipelineRequest) returns (job.JobResponse);
}

message RunPipelineRequest {
  common.PipelineId pipeline_id = 1;
}

message PipelineNode {
  common.NodeId node_id = 1;
  repeated common.NodeId deps = 2;
  string command = 3;
  repeated string args = 4;
}

message CreatePipelineRequest {
  string name = 1;
  common.ProjectId project_id = 2;
  repeated PipelineNode nodes = 3;
}

message GetPipelineRequest {
  common.PipelineId pipeline_id = 1;
}

message UpdatePipelineRequest {
  common.PipelineId pipeline_id = 1;
  optional string name = 2;
  repeated PipelineNode nodes = 3;
}

message PipelineResponse {
  common.PipelineId pipeline_id = 1;
  common.ProjectId project_id = 2;
  string name = 3;
  repeated PipelineNode nodes = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message PipelineSummary {
  common.PipelineId pipeline_id = 1;
  common.ProjectId project_id = 2;
  string name = 3;
  uint32 node_count = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message DeletePipelineRequest {
  common.PipelineId pipeline_id = 1;
}

message DeletePipelineResponse {}

message ListPipelinesRequest {
  optional common.PaginationRequest pagination = 1;
}

message ListPipelinesResponse {
  repeated PipelineSummary pipelines = 1;
  common.PaginationMetadata pagination = 2;
}

message ListProjectPipelinesRequest {
  common.ProjectId project_id = 1;
  optional common.PaginationRequest pagination = 2;
}

message ListOrganizationPipelinesRequest {
  common.OrganizationId organization_id = 1;
  optional common.PaginationRequest pagination = 2;
}
