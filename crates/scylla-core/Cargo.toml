[package]
name = "scylla-core"
version = "0.1.0"
edition = "2024"

[features]
default = ["postgres", "hash", "permission"]

# database backend
postgres = ["dep:sqlx"]

# infrastructure services
hash = ["dep:argon2"]
permission = ["dep:cedar-policy", "postgres"]

# ── SaaS edition gating ────────────────────────────────────────────────
# `saas` is the umbrella enabling every hosted-only feature; PaaS builds omit
# it. Each granular feature gates its module/use-case via `#[cfg(feature=…)]`,
# so the PaaS/SaaS difference is visible in the Rust source. The umbrella grows
# as features land (mail / invitations / oauth-github added in later phases).
saas = ["signup", "metering", "agent-org-scope", "mail", "invitations", "oauth-github"]
signup = []
metering = []
agent-org-scope = []
mail = ["dep:lettre"]
invitations = ["mail"]   # an invitation sends an email
oauth-github = ["dep:oauth2", "dep:reqwest"]

# Exposes `test_support` builders / seeders to downstream test crates. Off by
# default; turned on via dev-dependencies in `scylla-api` etc.
test-utils = []

[dependencies]
# domain
async-trait.workspace = true
thiserror.workspace = true
derive_more.workspace = true
nutype.workspace = true
bon.workspace = true
chrono = { workspace = true, features = ["serde"] }
ulid.workspace = true

# application
uuid.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
futures-core.workspace = true
futures-util.workspace = true

# infrastructure (postgres feature-gated)
sqlx = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
humantime-serde.workspace = true

# messaging: gRPC types for the in-process worker stream + live-tail
tonic.workspace = true

# infrastructure optional services
argon2 = { workspace = true, optional = true }
cedar-policy = { workspace = true, optional = true }
lettre = { workspace = true, optional = true }
oauth2 = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
sqlx = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
