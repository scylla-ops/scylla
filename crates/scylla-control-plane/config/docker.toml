[grpc]
address = "0.0.0.0:50051"

[database]
url = "postgres://scylla:scylla@postgres:5432/scylla"
max_connections = 16
min_connections = 1
acquire_timeout = "30s"
run_migrations = true

[cors]
allow_origins = ["http://localhost:5173", "http://localhost:8080"]
allow_headers = [
    "content-type",
    "authorization",
    "x-grpc-web",
    "x-user-agent"
]
expose_headers = [
    "grpc-status",
    "grpc-message",
    "grpc-status-details-bin"
]

# Broker client URL — recorder and API connect here. Same process, loopback.
[broker]
url = "http://127.0.0.1:50052"

# Broker server bind — the in-process hermes broker listens here.
[broker_server]
addr = "0.0.0.0:50052"
channel_capacity = 8192

[bootstrap]
username = "admin"
password = "admin123"
