[package]
name = "scylla-server"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true

# The composition root, as a library so that every edition binary (Community
# here, Enterprise out of tree) starts the same server with its own extensions.
[features]
# Public self-service signup (the gRPC RegistrationService). Off by default so a
# deployment stays invite-only / OAuth-only unless it opts in. Forwarded by the
# edition binaries.
register = ["scylla-core/register"]

[dependencies]
scylla-auth = { workspace = true }
scylla-core = { workspace = true }
scylla-db = { workspace = true }
scylla-extension = { workspace = true }
scylla-proto = { workspace = true }

tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http.workspace = true
http.workspace = true
tracing.workspace = true
anyhow.workspace = true

# cli: the command line and the tracing setup shared by the edition binaries
clap.workspace = true
tracing-subscriber.workspace = true

# the `PgPool` the binary opens and hands to `serve`
sqlx.workspace = true

# grpc
tonic.workspace = true
tonic-web.workspace = true
tonic-reflection.workspace = true
tonic-async-interceptor.workspace = true

[lints]
workspace = true
