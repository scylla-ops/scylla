syntax = "proto3";

package scylla.job.v1;

import "google/protobuf/timestamp.proto";
import "scylla/common/v1/common.proto";

// Jobs (one execution of a pipeline each) and the log lines they produce.
// PipelineService.RunPipeline, TriggerService.FireTriggerNow and a trigger
// that fires on its own each create a job. Lists return jobs newest first
// and log lines oldest first.
service JobService {
  // Requires readJob on the job.
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  // Requires deleteJob on the job. Any state; also deletes its log lines.
  rpc DeleteJob(DeleteJobRequest) returns (DeleteJobResponse);
  // Every job on the instance. Requires listJobs at system scope.
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  // Requires listJobsByPipeline on the pipeline.
  rpc ListPipelineJobs(ListPipelineJobsRequest) returns (ListPipelineJobsResponse);
  // Requires listJobsByProject on the project.
  rpc ListProjectJobs(ListProjectJobsRequest) returns (ListProjectJobsResponse);
  // Requires listJobsByOrganization on the organization.
  rpc ListOrganizationJobs(ListOrganizationJobsRequest) returns (ListOrganizationJobsResponse);
  // Requires readJobLogs on the job; also readJob on it when `node_id` is set.
  rpc ListJobLogs(ListJobLogsRequest) returns (ListJobLogsResponse);
  // Requires readJobLogs on the job. Replays every stored line, then sends
  // new lines as the agent reports them, none twice. The stream ends when
  // the agent reports the job complete or failed. A call made after that,
  // or before an agent starts the job, ends after the replay. A slow reader
  // can miss live lines; ListJobLogs holds the full record.
  rpc TailJobLogs(TailJobLogsRequest) returns (stream TailJobLogsResponse);
}

// Never UNSPECIFIED in a server response.
enum JobOutcome {
  JOB_OUTCOME_UNSPECIFIED = 0;
  // Every node completed.
  JOB_OUTCOME_COMPLETED = 1;
  // A node failed, or the agent could not run the job.
  JOB_OUTCOME_FAILED = 2;
  JOB_OUTCOME_CANCELLED = 3;
  // The agent disconnected before it reported a result. `Terminal.finished_at`
  // is the time the server detected that.
  JOB_OUTCOME_ORPHANED = 4;
}

// Never UNSPECIFIED in a server response.
enum NodeOutcome {
  NODE_OUTCOME_UNSPECIFIED = 0;
  NODE_OUTCOME_COMPLETED = 1;
  NODE_OUTCOME_FAILED = 2;
  // The job was cancelled before the node finished.
  NODE_OUTCOME_CANCELLED = 3;
  // Another node of the job failed; the agent skipped or stopped this one.
  NODE_OUTCOME_SKIPPED = 4;
}

message Job {
  scylla.common.v1.JobId job_id = 1;
  scylla.common.v1.PipelineId pipeline_id = 2;
  // One entry per node of the pipeline as it was when the job was created.
  repeated JobNode node_executions = 3;
  google.protobuf.Timestamp created_at = 4;
  // Moves on every state change of the job or of one of its nodes.
  google.protobuf.Timestamp updated_at = 5;

  oneof state {
    Pending pending = 10;
    Running running = 11;
    Terminal terminal = 12;
  }

  // `human`, `app`: that principal called PipelineService.RunPipeline.
  // `cron`, `webhook`: that trigger fired on its own or via FireTriggerNow.
  oneof origin {
    Human human = 20;
    App app = 21;
    Cron cron = 22;
    Webhook webhook = 23;
  }

  // No agent has started the job yet.
  message Pending {}
  // An agent reported the job started.
  message Running { google.protobuf.Timestamp started_at = 1; }
  // `started_at` is absent when the job ended before an agent started it.
  message Terminal {
    JobOutcome outcome = 1;
    google.protobuf.Timestamp started_at = 2;
    google.protobuf.Timestamp finished_at = 3;
  }

  message Human { scylla.common.v1.UserId user_id = 1; }
  message App { scylla.common.v1.AppId app_id = 1; }
  message Cron { scylla.common.v1.TriggerId trigger_id = 1; }
  message Webhook {
    scylla.common.v1.TriggerId trigger_id = 1;
    // The sender's `X-Scylla-Delivery` header, else `X-GitHub-Delivery`.
    // Absent when the sender sent neither, or FireTriggerNow started the run.
    optional string delivery_id = 2;
  }
}

message JobNode {
  scylla.common.v1.NodeId node_id = 1;

  oneof execution {
    Pending pending = 10;
    Running running = 11;
    Finished finished = 12;
  }

  message Pending {}
  message Running { google.protobuf.Timestamp started_at = 1; }
  // `started_at` is absent when the node was skipped or cancelled before it
  // started.
  message Finished {
    NodeOutcome outcome = 1;
    google.protobuf.Timestamp started_at = 2;
    google.protobuf.Timestamp finished_at = 3;
  }
}

// One output line, without its terminator. The agent replaces the value of
// each secret-backed environment variable with `***` before it sends it.
message JobLogEntry {
  scylla.common.v1.JobLogId job_log_id = 1;
  scylla.common.v1.JobId job_id = 2;
  scylla.common.v1.NodeId node_id = 3;
  scylla.common.v1.LogStream stream = 4;
  string line = 5;
  // Capture time from the agent; server receive time when the agent sent none.
  google.protobuf.Timestamp timestamp = 6;
}

message GetJobRequest { scylla.common.v1.JobId job_id = 1; }

message GetJobResponse { Job job = 1; }

message DeleteJobRequest { scylla.common.v1.JobId job_id = 1; }

message DeleteJobResponse {}

message ListJobsRequest { scylla.common.v1.PaginationRequest pagination = 1; }

message ListJobsResponse {
  repeated Job jobs = 1;
  scylla.common.v1.PaginationMetadata pagination = 2;
}

message ListPipelineJobsRequest {
  scylla.common.v1.PipelineId pipeline_id = 1;
  scylla.common.v1.PaginationRequest pagination = 2;
}

message ListPipelineJobsResponse {
  repeated Job jobs = 1;
  scylla.common.v1.PaginationMetadata pagination = 2;
}

message ListProjectJobsRequest {
  scylla.common.v1.ProjectId project_id = 1;
  scylla.common.v1.PaginationRequest pagination = 2;
}

message ListProjectJobsResponse {
  repeated Job jobs = 1;
  scylla.common.v1.PaginationMetadata pagination = 2;
}

message ListOrganizationJobsRequest {
  scylla.common.v1.OrganizationId organization_id = 1;
  scylla.common.v1.PaginationRequest pagination = 2;
}

message ListOrganizationJobsResponse {
  repeated Job jobs = 1;
  scylla.common.v1.PaginationMetadata pagination = 2;
}

message ListJobLogsRequest {
  scylla.common.v1.JobId job_id = 1;
  // Unset: lines of every node. Set: only that node's lines; the page is
  // empty while the node is pending or when the job has no such node.
  scylla.common.v1.NodeId node_id = 2;
  scylla.common.v1.PaginationRequest pagination = 3;
}

message ListJobLogsResponse {
  repeated JobLogEntry logs = 1;
  scylla.common.v1.PaginationMetadata pagination = 2;
}

message TailJobLogsRequest {
  scylla.common.v1.JobId job_id = 1;
  // Unset: lines of every node.
  scylla.common.v1.NodeId node_id = 2;
}

message TailJobLogsResponse { JobLogEntry log = 1; }
