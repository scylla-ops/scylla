syntax = "proto3";

package scylla.project.v1;

import "google/protobuf/timestamp.proto";
import "scylla/common/v1/common.proto";

// Projects, the units of work inside an organization. Membership is a role
// grant. Add or remove a member with scylla.authz.v1.GrantService (CreateGrant,
// RevokeGrant, RevokeAllAccess); read a member's roles with
// GrantService.ListGrants at the project scope.
service ProjectService {
  // Requires `createProject` on the organization. A user caller also gets the
  // builtin `project-admin` role on the new project, effective when the call
  // returns; an app caller gets no grant. Fails with RESOURCE_EXHAUSTED when
  // the deployment sets a project quota and the organization has reached it.
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  // Requires `readProject` on the project.
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  // Requires `updateProject` on the project. A set field replaces the stored
  // value and bumps `updated_at`; an unset field keeps its value.
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);
  // Requires `updateProject` on the project. Stores `is_active` as given.
  // Repeating the current value changes nothing, not even `updated_at`.
  rpc SetProjectActive(SetProjectActiveRequest) returns (SetProjectActiveResponse);
  // Requires `deleteProject` on the project. Cascades to its pipelines, their
  // triggers and jobs, and its secrets. Revokes every grant scoped to the
  // project; the revocation is effective when the call returns.
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);
  // Requires `listProjects` at system scope. Every project of every
  // organization, inactive ones included, newest first.
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  // Requires `readOrganization` on the organization. With
  // `listProjectsByOrganization` on it, lists every project of the organization.
  // Without it, only the projects where a grant at any scope gives the caller
  // `readProject`, possibly none. Both cases include inactive projects, newest
  // first.
  rpc ListOrganizationProjects(ListOrganizationProjectsRequest) returns (ListOrganizationProjectsResponse);
  // Requires `listUserProjects` on the user; a user always holds it for
  // itself. Lists the projects where the user holds a grant scoped to the
  // project or to its organization, newest first.
  rpc ListUserProjects(ListUserProjectsRequest) returns (ListUserProjectsResponse);
  // Requires `listProjectMembers` on the project. Lists the users that hold a
  // grant scoped to this project, most recently granted first. Omits users
  // whose only access is an organization or system grant, and never lists
  // apps.
  rpc ListProjectMembers(ListProjectMembersRequest) returns (ListProjectMembersResponse);
}

// A unit of work inside one organization; no RPC moves it to another.
message Project {
  scylla.common.v1.ProjectId project_id = 1;
  scylla.common.v1.OrganizationId organization_id = 2;
  string name = 3;
  // Empty when the project has no description.
  string description = 4;
  // True on creation; only SetProjectActive changes it. No RPC checks it: an
  // inactive project accepts the same calls as an active one.
  bool is_active = 5;
  google.protobuf.Timestamp created_at = 6;
  // An UpdateProject that sets a field, or a SetProjectActive that changes the
  // flag, bumps it.
  google.protobuf.Timestamp updated_at = 7;
}

// One user holding a grant scoped to the project.
message ProjectMember {
  scylla.common.v1.UserId user_id = 1;
  string username = 2;
}

message CreateProjectRequest {
  scylla.common.v1.OrganizationId organization_id = 1;
  // Trimmed; 1 to 255 bytes after trimming; need not be unique.
  string name = 2;
  // Trimmed; at most 1024 bytes. Unset or empty: no description.
  optional string description = 3;
}

message CreateProjectResponse { Project project = 1; }

message GetProjectRequest { scylla.common.v1.ProjectId project_id = 1; }

message GetProjectResponse { Project project = 1; }

message UpdateProjectRequest {
  scylla.common.v1.ProjectId project_id = 1;
  // Same rules as CreateProjectRequest.name.
  optional string name = 2;
  // Same rules as CreateProjectRequest.description; empty clears it.
  optional string description = 3;
}

message UpdateProjectResponse { Project project = 1; }

message SetProjectActiveRequest {
  scylla.common.v1.ProjectId project_id = 1;
  bool is_active = 2;
}

message SetProjectActiveResponse { Project project = 1; }

message DeleteProjectRequest { scylla.common.v1.ProjectId project_id = 1; }

message DeleteProjectResponse {}

message ListProjectsRequest { scylla.common.v1.PaginationRequest pagination = 1; }

message ListProjectsResponse {
  repeated Project projects = 1;
  scylla.common.v1.PaginationMetadata pagination = 2;
}

message ListOrganizationProjectsRequest {
  scylla.common.v1.OrganizationId organization_id = 1;
  scylla.common.v1.PaginationRequest pagination = 2;
}

message ListOrganizationProjectsResponse {
  repeated Project projects = 1;
  scylla.common.v1.PaginationMetadata pagination = 2;
}

message ListUserProjectsRequest {
  scylla.common.v1.UserId user_id = 1;
  scylla.common.v1.PaginationRequest pagination = 2;
}

message ListUserProjectsResponse {
  repeated Project projects = 1;
  scylla.common.v1.PaginationMetadata pagination = 2;
}

message ListProjectMembersRequest {
  scylla.common.v1.ProjectId project_id = 1;
  scylla.common.v1.PaginationRequest pagination = 2;
}

message ListProjectMembersResponse {
  repeated ProjectMember members = 1;
  scylla.common.v1.PaginationMetadata pagination = 2;
}

