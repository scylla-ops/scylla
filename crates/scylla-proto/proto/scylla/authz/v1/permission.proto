syntax = "proto3";

package scylla.authz.v1;

import "scylla/common/v1/common.proto";

// The permission vocabulary. A role holds a set of values (Access.Restricted)
// or all of them (Access.FullControl); a grant gives a principal a role at one
// scope. No value implies another. A value's key is its name without
// `PERMISSION_`, in lowerCamelCase: `readAppStats`. CreateRole and UpdateRole
// errors name that key; PERMISSION_DENIED answers "Action denied" without it.
// The server never checks a value marked not enforced: it is absent from
// RoleService.ListAuthzVocabulary and rejected in a role. ListAuthzVocabulary
// returns every enforced value, paired with the narrowest scope kind a role
// may hold it at. Values are append-only.
enum Permission {
  PERMISSION_UNSPECIFIED = 0;
  // SCOPE_KIND_SYSTEM role only.
  PERMISSION_CREATE_USER = 1;
  // Implicit on the user's own account; in a role, SCOPE_KIND_SYSTEM only.
  PERMISSION_READ_USER = 2;
  // Implicit on the user's own account; in a role, SCOPE_KIND_SYSTEM only.
  PERMISSION_UPDATE_USER = 3;
  // Not implicit on the user's own account. SCOPE_KIND_SYSTEM role only.
  PERMISSION_DELETE_USER = 4;
  // Every user of the installation. SCOPE_KIND_SYSTEM role only.
  PERMISSION_LIST_USERS = 5;
  // SCOPE_KIND_SYSTEM role only.
  PERMISSION_CREATE_ORGANIZATION = 6;
  PERMISSION_READ_ORGANIZATION = 7;
  PERMISSION_UPDATE_ORGANIZATION = 8;
  PERMISSION_DELETE_ORGANIZATION = 9;
  // Every organization of the installation. SCOPE_KIND_SYSTEM role only.
  PERMISSION_LIST_ORGANIZATIONS = 10;
  PERMISSION_LIST_ORGANIZATION_MEMBERS = 11;
  // Not enforced.
  PERMISSION_ADD_ORGANIZATION_MEMBER = 12;
  // Not enforced.
  PERMISSION_REMOVE_ORGANIZATION_MEMBER = 13;
  // Create, list pending and revoke the invitations of one organization.
  // Accepting one needs no permission.
  PERMISSION_MANAGE_INVITATIONS = 14;
  // Implicit on the user's own account; in a role, SCOPE_KIND_SYSTEM only.
  PERMISSION_LIST_USER_ORGANIZATIONS = 15;
  PERMISSION_CREATE_PROJECT = 16;
  PERMISSION_READ_PROJECT = 17;
  PERMISSION_UPDATE_PROJECT = 18;
  PERMISSION_DELETE_PROJECT = 19;
  // Every project of the installation. SCOPE_KIND_SYSTEM role only.
  PERMISSION_LIST_PROJECTS = 20;
  PERMISSION_LIST_PROJECTS_BY_ORGANIZATION = 21;
  PERMISSION_LIST_PROJECT_MEMBERS = 22;
  // Not enforced.
  PERMISSION_ADD_PROJECT_MEMBER = 23;
  // Not enforced.
  PERMISSION_REMOVE_PROJECT_MEMBER = 24;
  // Implicit on the user's own account; in a role, SCOPE_KIND_SYSTEM only.
  PERMISSION_LIST_USER_PROJECTS = 25;
  PERMISSION_CREATE_PIPELINE = 26;
  PERMISSION_READ_PIPELINE = 27;
  PERMISSION_UPDATE_PIPELINE = 28;
  PERMISSION_DELETE_PIPELINE = 29;
  // Starts a run of one pipeline. Also needed to create or update its triggers.
  PERMISSION_RUN_PIPELINE = 30;
  // The server checks it on the agent's app at dispatch; an agent whose app
  // lacks it on the pipeline never receives its jobs.
  PERMISSION_EXECUTE_JOB = 31;
  // Every pipeline of the installation. SCOPE_KIND_SYSTEM role only.
  PERMISSION_LIST_PIPELINES = 32;
  PERMISSION_LIST_PIPELINES_BY_PROJECT = 33;
  PERMISSION_LIST_PIPELINES_BY_ORGANIZATION = 34;
  // SCOPE_KIND_SYSTEM role only.
  PERMISSION_CREATE_JOB = 35;
  PERMISSION_READ_JOB = 36;
  PERMISSION_UPDATE_JOB = 37;
  PERMISSION_DELETE_JOB = 38;
  // Every job of the installation. SCOPE_KIND_SYSTEM role only.
  PERMISSION_LIST_JOBS = 39;
  PERMISSION_LIST_JOBS_BY_PIPELINE = 40;
  PERMISSION_LIST_JOBS_BY_PROJECT = 41;
  PERMISSION_LIST_JOBS_BY_ORGANIZATION = 42;
  PERMISSION_READ_JOB_LOGS = 43;
  PERMISSION_WRITE_JOB_LOGS = 44;
  // An agent's status events for a job it runs, over AgentService.Open.
  PERMISSION_WRITE_JOB_STATUS = 45;
  // An agent's log lines for a job it runs, over AgentService.Open.
  // PERMISSION_WRITE_JOB_LOGS does not cover this.
  PERMISSION_APPEND_JOB_LOG = 46;
  PERMISSION_CREATE_APP = 47;
  // One app, agents included (AgentAdminService.GetAgent), and the list of
  // its client secrets. Not its stats.
  PERMISSION_READ_APP = 48;
  // The job-execution stats of one agent (AgentAdminService.GetAgentStats).
  PERMISSION_READ_APP_STATS = 49;
  // Delete one app, agents included. Also gates activating or deactivating
  // it and creating, revoking, enabling or disabling its client secrets.
  PERMISSION_DELETE_APP = 50;
  PERMISSION_LIST_APPS_BY_ORGANIZATION = 51;
  PERMISSION_CREATE_AGENT = 52;
  PERMISSION_LIST_AGENTS = 53;
  // Create, list and revoke grants bound to SYSTEM; also
  // GrantService.ListGrants without a scope and
  // RoleService.GetEffectivePermissions on another principal. The caller
  // confers only permissions it holds at SYSTEM; otherwise
  // FAILED_PRECONDITION. SCOPE_KIND_SYSTEM role only.
  PERMISSION_MANAGE_SYSTEM_GRANTS = 54;
  // Create, list and revoke grants bound to one organization. The caller
  // confers only permissions it holds there or at SYSTEM; otherwise
  // FAILED_PRECONDITION.
  PERMISSION_MANAGE_ORG_GRANTS = 55;
  // Create, list and revoke grants bound to one project.
  PERMISSION_MANAGE_PROJECT_GRANTS = 56;
  reserved 57;
  reserved "PERMISSION_MANAGE_POLICIES";
  // Every RoleService RPC except GetMyPermissions and GetEffectivePermissions.
  // SCOPE_KIND_SYSTEM role only.
  PERMISSION_MANAGE_ROLES = 58;
  PERMISSION_CREATE_SECRET = 59;
  PERMISSION_LIST_SECRETS = 60;
  PERMISSION_DELETE_SECRET = 61;
  // Get, list, enable, disable and delete the triggers of one pipeline.
  // Create and update also need PERMISSION_RUN_PIPELINE on that pipeline.
  PERMISSION_MANAGE_TRIGGERS = 62;
}

// The tenancy level of a role or a grant, without the entity. Broadest to
// narrowest: SYSTEM, ORGANIZATION, PROJECT. A role declares one kind; a grant
// of it must bind to a ScopeRef of that kind. The server rejects
// SCOPE_KIND_UNSPECIFIED wherever it reads a kind.
enum ScopeKind {
  SCOPE_KIND_UNSPECIFIED = 0;
  SCOPE_KIND_SYSTEM = 1;
  SCOPE_KIND_ORGANIZATION = 2;
  SCOPE_KIND_PROJECT = 3;
}

// Where a grant applies. A grant covers its scope and everything beneath it.
// SYSTEM covers every organization, project, pipeline, job, app and user; an
// organization covers its projects, pipelines, jobs and apps; a project
// covers its pipelines and jobs. Exactly one arm must be set; an
// organization or project arm also needs its id (System carries none).
message ScopeRef {
  oneof scope {
    System system = 1;
    Organization organization = 2;
    Project project = 3;
  }

  message System {}
  message Organization { scylla.common.v1.OrganizationId organization_id = 1; }
  message Project { scylla.common.v1.ProjectId project_id = 1; }
}

// Who holds a grant: a user or an app (a machine principal such as an agent).
// Exactly one arm must be set, with its id.
message PrincipalRef {
  oneof principal {
    User user = 1;
    App app = 2;
  }

  message User { scylla.common.v1.UserId user_id = 1; }
  message App { scylla.common.v1.AppId app_id = 1; }
}

// One entry of RoleService.ListAuthzVocabulary.
message AuthzAction {
  Permission permission = 1;
  // The narrowest scope kind whose subtree contains the permission's target.
  // A role may hold the permission when its kind is this or broader;
  // CreateRole and UpdateRole reject a narrower role.
  ScopeKind min_scope = 2;
}

// What a role confers within its scope (Role.access) and what
// GetEffectivePermissions and GetMyPermissions resolve per scope
// (EffectiveScope.access). When sent, exactly one arm must be set.
message Access {
  oneof access {
    FullControl full_control = 1;
    Restricted restricted = 2;
  }

  // Every permission in the scope, including values added in later releases.
  message FullControl {}
  // Exactly the listed permissions. When sent, the list is non-empty and
  // holds neither PERMISSION_UNSPECIFIED nor an unenforced value. In an
  // EffectiveScope it is the union across the roles held at that scope,
  // without duplicates.
  message Restricted { repeated Permission permissions = 1; }
}
