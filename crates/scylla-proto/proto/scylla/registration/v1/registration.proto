syntax = "proto3";

package scylla.registration.v1;

import "scylla/common/v1/common.proto";

// Public self-service signup. Only a server built with the `register` feature
// mounts the service; on other builds calls fail with UNIMPLEMENTED.
service RegistrationService {
  // In one transaction: creates a user, creates an organization and grants the
  // user the `organization-admin` role on it. A failure after the commit, for
  // example when the session cannot be stored, returns INTERNAL and leaves the
  // account in place. A retry then returns ALREADY_EXISTS.
  rpc Signup(SignupRequest) returns (SignupResponse);
}

message SignupRequest {
  // Trimmed; 1 to 255 bytes; unique across the server.
  string username = 1;
  // Plain text; 8 to 255 characters; not whitespace only. The server stores
  // only a hash.
  string password = 2;
  // Required; unique across the server.
  scylla.common.v1.Email email = 3;
  // Trimmed; 1 to 255 bytes; not unique.
  string organization_name = 4;
}

message SignupResponse {
  // Opaque. Expires 24 hours after signup; AuthService.RevokeToken revokes it
  // earlier.
  string token = 1;
  scylla.common.v1.UserId user_id = 2;
  // The organization this call created.
  scylla.common.v1.OrganizationId organization_id = 3;
}
