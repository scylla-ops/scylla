syntax = "proto3";

package scylla.organization.v1;

import "google/protobuf/timestamp.proto";
import "scylla/common/v1/common.proto";

// Organizations, the top-level tenant: projects, apps, agents and invitations
// each belong to one. Membership is a role grant: add a member with
// scylla.authz.v1.GrantService.CreateGrant, remove one with RevokeGrant or
// RevokeAllAccess, and read a member's roles through scylla.authz.v1.
service OrganizationService {
  // Requires `createOrganization`. The new organization is active. A user
  // caller also gets the built-in `organization-admin` role on it, effective
  // when the call returns. An app caller gets no grant.
  rpc CreateOrganization(CreateOrganizationRequest) returns (CreateOrganizationResponse);
  // Requires `readOrganization` on the organization.
  rpc GetOrganization(GetOrganizationRequest) returns (GetOrganizationResponse);
  // Requires `updateOrganization` on the organization. Only the fields set in
  // the request change; a request with no field set returns the organization
  // unchanged.
  rpc UpdateOrganization(UpdateOrganizationRequest) returns (UpdateOrganizationResponse);
  // Requires `updateOrganization` on the organization. Stores `is_active` as
  // given. Repeating the current value succeeds and leaves `updated_at`
  // unchanged.
  rpc SetOrganizationActive(SetOrganizationActiveRequest) returns (SetOrganizationActiveResponse);
  // Requires `deleteOrganization` on the organization. Cascades to the
  // organization's projects, pipelines, triggers, jobs, job logs, secrets,
  // apps, agents, invitations and custom roles. Revokes every grant scoped
  // to the organization or to one of its projects, and every grant held by
  // one of its apps. The revocation is effective when the call returns.
  rpc DeleteOrganization(DeleteOrganizationRequest) returns (DeleteOrganizationResponse);
  // Requires `listOrganizations`. Every organization, inactive ones included,
  // newest first by `created_at`.
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse);
  // Requires `listOrganizationMembers` on the organization. Lists each user
  // that holds at least one grant scoped to the organization or to one of
  // its projects, once. Members are ordered by the creation time of that
  // user's most recent such grant, newest first. Omits app principals and
  // users whose only access is a system-scoped grant. No existence check:
  // an unknown id returns an empty page, not NOT_FOUND.
  rpc ListOrganizationMembers(ListOrganizationMembersRequest) returns (ListOrganizationMembersResponse);
  // Requires `listUserOrganizations` on the user; a user always holds it for
  // its own `user_id`. Lists the organizations, inactive ones included,
  // where the user holds at least one grant scoped to the organization or
  // to one of its projects. Newest first by `created_at`. A system-scoped
  // grant adds no organization. No existence check: an unknown `user_id`
  // returns an empty page, not NOT_FOUND.
  rpc ListUserOrganizations(ListUserOrganizationsRequest) returns (ListUserOrganizationsResponse);
}

message Organization {
  scylla.common.v1.OrganizationId organization_id = 1;
  // Trimmed; 1 to 255 bytes; unique across organizations.
  string name = 2;
  // Trimmed; at most 1024 bytes; empty when unset.
  string description = 3;
  // True on creation; changed only by SetOrganizationActive.
  bool is_active = 4;
  google.protobuf.Timestamp created_at = 5;
  // Equal to `created_at` until the first change. Moves when
  // UpdateOrganization sets at least one field and when
  // SetOrganizationActive changes the flag.
  google.protobuf.Timestamp updated_at = 6;
}

// One row of ListOrganizationMembers.
message OrganizationMember {
  scylla.common.v1.UserId user_id = 1;
  string username = 2;
}

message CreateOrganizationRequest {
  // Trimmed; 1 to 255 bytes; unique across organizations.
  string name = 1;
  // Trimmed; at most 1024 bytes. Absent: no description.
  optional string description = 2;
}

message CreateOrganizationResponse { Organization organization = 1; }

message GetOrganizationRequest { scylla.common.v1.OrganizationId organization_id = 1; }

message GetOrganizationResponse { Organization organization = 1; }

message UpdateOrganizationRequest {
  scylla.common.v1.OrganizationId organization_id = 1;
  // Absent: unchanged. Trimmed; 1 to 255 bytes; must differ from every other
  // organization's name; the current name is accepted.
  optional string name = 2;
  // Absent: unchanged. Set: replaces the description, an empty string
  // included. Trimmed; at most 1024 bytes.
  optional string description = 3;
}

message UpdateOrganizationResponse { Organization organization = 1; }

message SetOrganizationActiveRequest {
  scylla.common.v1.OrganizationId organization_id = 1;
  bool is_active = 2;
}

message SetOrganizationActiveResponse { Organization organization = 1; }

message DeleteOrganizationRequest { scylla.common.v1.OrganizationId organization_id = 1; }

message DeleteOrganizationResponse {}

message ListOrganizationsRequest { scylla.common.v1.PaginationRequest pagination = 1; }

message ListOrganizationsResponse {
  repeated Organization organizations = 1;
  scylla.common.v1.PaginationMetadata pagination = 2;
}

message ListOrganizationMembersRequest {
  scylla.common.v1.OrganizationId organization_id = 1;
  scylla.common.v1.PaginationRequest pagination = 2;
}

message ListOrganizationMembersResponse {
  repeated OrganizationMember members = 1;
  scylla.common.v1.PaginationMetadata pagination = 2;
}

message ListUserOrganizationsRequest {
  scylla.common.v1.UserId user_id = 1;
  scylla.common.v1.PaginationRequest pagination = 2;
}

message ListUserOrganizationsResponse {
  repeated Organization organizations = 1;
  scylla.common.v1.PaginationMetadata pagination = 2;
}

