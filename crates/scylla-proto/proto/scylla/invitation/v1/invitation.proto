syntax = "proto3";

package scylla.invitation.v1;

import "google/protobuf/timestamp.proto";
import "scylla/common/v1/common.proto";

// Management of organization invitations. No RPC returns the invite token;
// it reaches the invitee by email only.
service InvitationService {
  // Requires `manageInvitations` on `organization_id`. Creates a PENDING
  // invitation for `email` and sends the invite token to that address. Each
  // call creates a new invitation; an earlier pending one for the same email
  // stays valid. A mail delivery failure does not fail the call: the server
  // stores the invitation anyway.
  rpc CreateInvitation(CreateInvitationRequest) returns (CreateInvitationResponse);
  // Requires `manageInvitations` on `organization_id`. Returns the PENDING
  // invitations, newest first. Expired ones stay listed while PENDING;
  // compare `expires_at` to filter them out.
  rpc ListInvitations(ListInvitationsRequest) returns (ListInvitationsResponse);
  // Requires `manageInvitations` on the invitation; a grant on the
  // invitation's organization reaches it. An unknown `invitation_id` has no
  // organization: it fails with PERMISSION_DENIED, and with NOT_FOUND only for
  // a System grant. Sets the status to REVOKED. Revoking an ACCEPTED
  // invitation succeeds but keeps the membership that acceptance granted.
  rpc RevokeInvitation(RevokeInvitationRequest) returns (RevokeInvitationResponse);
}

// Acceptance by the invitee. The invite token from the email is the credential.
service InvitationAcceptService {
  // Consumes the invite token. An unknown token returns NOT_FOUND. A token
  // whose invitation is not PENDING, or is past `expires_at`, returns
  // FAILED_PRECONDITION. When an account with the invited email exists, it
  // joins and the call validates `username` and `password` but stores
  // neither. Otherwise the call creates the account from them. The invitation
  // becomes ACCEPTED and the invitee at once holds its role on the
  // organization, or `organization-member` when the invitation has none.
  rpc AcceptInvitation(AcceptInvitationRequest) returns (AcceptInvitationResponse);
}

// PENDING on creation, ACCEPTED after AcceptInvitation, REVOKED after
// RevokeInvitation. Expiry is not a status: a PENDING invitation past
// `expires_at` still reports PENDING but can no longer be accepted.
enum InvitationStatus {
  INVITATION_STATUS_UNSPECIFIED = 0;
  INVITATION_STATUS_PENDING = 1;
  INVITATION_STATUS_ACCEPTED = 2;
  INVITATION_STATUS_REVOKED = 3;
}

message Invitation {
  scylla.common.v1.InvitationId invitation_id = 1;
  scylla.common.v1.OrganizationId organization_id = 2;
  scylla.common.v1.Email email = 3;
  // Role granted on acceptance; absent when it grants `organization-member`.
  scylla.common.v1.RoleId role = 4;
  InvitationStatus status = 5;
  // Creation time plus 7 days.
  google.protobuf.Timestamp expires_at = 6;
}

message CreateInvitationRequest {
  scylla.common.v1.OrganizationId organization_id = 1;
  // Required.
  scylla.common.v1.Email email = 2;
  // Omit the message for a plain member (`organization-member`). Otherwise
  // trimmed; must name an existing role with organization scope; the server
  // rejects an empty value.
  scylla.common.v1.RoleId role = 3;
}

message CreateInvitationResponse { Invitation invitation = 1; }

message ListInvitationsRequest { scylla.common.v1.OrganizationId organization_id = 1; }

message ListInvitationsResponse { repeated Invitation invitations = 1; }

message RevokeInvitationRequest { scylla.common.v1.InvitationId invitation_id = 1; }

message RevokeInvitationResponse {}

message AcceptInvitationRequest {
  // The invite token from the email. Single use.
  string token = 1;
  // Trimmed; 1 to 255 bytes; unique among users when the call creates the
  // account.
  string username = 2;
  // Plaintext; 8 to 255 characters; not whitespace only. The server stores
  // only a hash.
  string password = 3;
}

message AcceptInvitationResponse {
  // Opaque session token for the invitee. Valid for 24 hours.
  string token = 1;
  // The new account, or the existing one with the invited email.
  scylla.common.v1.UserId user_id = 2;
  scylla.common.v1.OrganizationId organization_id = 3;
}
