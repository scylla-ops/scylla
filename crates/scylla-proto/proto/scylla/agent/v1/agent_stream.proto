syntax = "proto3";

package scylla.agent.v1;

import "google/protobuf/timestamp.proto";
import "scylla/common/v1/common.proto";
import "scylla/exec/v1/step.proto";

// Long-lived bidirectional stream between the control plane and one agent.
// Open accepts only an app token, checked once when the stream opens; a user
// session token fails with PERMISSION_DENIED. No permission key is required.
//
// The open stream is the agent's presence; there is no heartbeat. The control
// plane pushes JobDispatch frames; the agent answers with JobStatus and
// JobLogLine frames. The control plane offers a job only to a connected agent
// that holds `executeJob` on the job's pipeline. Among eligible agents it picks
// the one with the fewest jobs in flight. A second Open with the same app
// replaces the first: the older stream stops receiving and ends. Every 30
// seconds the control plane marks `orphaned` each running job whose agent is
// not connected at that moment. An agent that reconnects before that check
// keeps its running jobs. `last_seen` in AgentAdminService.GetAgent advances
// when the stream opens, on every JobStatus and AgentHello frame, and when the
// stream closes.
service AgentService {
  rpc Open(stream AgentUp) returns (stream AgentDown);
}

// One frame from the control plane to the agent. An arm the agent does not
// know (a newer control plane) decodes with `payload` unset; skip such a
// frame.
message AgentDown {
  oneof payload {
    JobDispatch dispatch = 1;
  }
}

// One frame from the agent to the control plane. A frame with no `payload` is
// ignored. The control plane never answers a frame with an error. A status or
// log the caller may not write, or that breaks a rule, is logged server-side
// and dropped. The stream stays open.
message AgentUp {
  oneof payload {
    JobStatus status = 1;
    JobLogLine log = 2;
    AgentHello hello = 3;
  }
}

// The machine the agent runs on. Optional: an agent that never sends it stays
// connected and receives jobs. The reference agent sends it once, right after
// the stream opens. The control plane accepts it at any time, stores the
// latest one as the agent's `host` (see AgentAdminService.GetAgent) and does
// not use it for scheduling.
message AgentHello {
  string version = 1;
  string os = 2;
  string arch = 3;
  string hostname = 4;
  // `0` means unknown and is stored as unset.
  int32 cpu_count = 5;
  // In MiB. `0` means unknown and is stored as unset.
  int64 total_memory_mb = 6;
}

// A job ready to run: every secret reference is resolved and every trigger
// input is in the node env. The control plane attributes the job to this
// agent and offers it to no other. Answer with JobStatus frames, first
// `job_started`, last `job_completed` or `job_failed`.
message JobDispatch {
  scylla.common.v1.JobId job_id = 1;
  scylla.common.v1.PipelineId pipeline_id = 2;
  repeated AgentNode nodes = 3;
}

// One pipeline node with its env resolved. `deps` lists the node ids this node
// waits for. `step` is always set.
message AgentNode {
  scylla.common.v1.NodeId node_id = 1;
  repeated scylla.common.v1.NodeId deps = 2;
  // Relative to the job workspace, never absolute, never containing `..`.
  // Empty means the workspace root.
  string working_dir = 3;
  // Node env plus trigger inputs; a node key wins over an input with the same
  // key.
  repeated ResolvedEnv env = 4;

  oneof step {
    scylla.exec.v1.ExecStep exec = 10;
    scylla.exec.v1.ScriptStep script = 11;
  }
}

// One environment variable with its final value. `masked` is true when the
// value came from a project secret, not for a literal or a trigger input. The
// agent must scrub a masked value from the log lines it sends; the reference
// agent replaces it with `***`.
message ResolvedEnv {
  string key = 1;
  string value = 2;
  bool masked = 3;
}

// One job lifecycle event. Requires `writeJobStatus` on the job. A status with
// no `event` is ignored. `job_started` needs a pending job. `job_completed` and
// `job_failed` need a running job. `node_started` needs a pending node.
// `node_completed` and `node_failed` need a running node. `node_skipped` needs
// a node that has not finished. A node id must belong to the job. An event that
// breaks a rule does not change the job. Whether or not the job changed,
// `job_started` opens the live tail for JobService.TailJobLogs, and
// `job_completed` and `job_failed` close it and decrement the agent's in-flight
// count. The control plane does not store `error` in JobFailed or NodeFailed.
message JobStatus {
  scylla.common.v1.JobId job_id = 1;

  oneof event {
    JobStarted job_started = 10;
    JobCompleted job_completed = 11;
    JobFailed job_failed = 12;
    NodeStarted node_started = 13;
    NodeCompleted node_completed = 14;
    NodeFailed node_failed = 15;
    NodeSkipped node_skipped = 16;
  }

  message JobStarted {}
  message JobCompleted {}
  message JobFailed { string error = 1; }

  message NodeStarted { scylla.common.v1.NodeId node_id = 1; }
  message NodeCompleted { scylla.common.v1.NodeId node_id = 1; }
  // The node did not run, usually because a dependency failed or the job
  // stopped before reaching it.
  message NodeSkipped { scylla.common.v1.NodeId node_id = 1; }
  message NodeFailed {
    scylla.common.v1.NodeId node_id = 1;
    string error = 2;
  }
}

// One line of output from a running node. Requires `appendJobLog` on the job.
// A line with an invalid `node_id` is dropped. An unset `timestamp` becomes
// the receive time. An accepted line is stored (JobService.ListJobLogs) and
// pushed to live JobService.TailJobLogs subscribers.
message JobLogLine {
  scylla.common.v1.JobId job_id = 1;
  scylla.common.v1.NodeId node_id = 2;
  scylla.common.v1.LogStream stream = 3;
  string line = 4;
  google.protobuf.Timestamp timestamp = 5;
}
