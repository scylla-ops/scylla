syntax = "proto3";

package scylla.secret.v1;

import "google/protobuf/timestamp.proto";
import "scylla/common/v1/common.proto";

// Project-scoped secrets referenced from pipeline node env vars. Values are
// encrypted at rest and decrypted only at dispatch — the API never returns a
// secret value, only metadata. All RPCs are gated by the matching project-scoped
// permission (createSecret / listSecrets / deleteSecret).
service SecretService {
  rpc CreateSecret(CreateSecretRequest) returns (CreateSecretResponse);
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
}

// Secret metadata. Never carries the value.
message Secret {
  scylla.common.v1.SecretId secret_id = 1;
  scylla.common.v1.ProjectId project_id = 2;
  // The name a pipeline's `EnvVar.secret_ref` matches on.
  string name = 3;
  string description = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message CreateSecretRequest {
  scylla.common.v1.ProjectId project_id = 1;
  string name = 2;
  // The plaintext value, write-only — encrypted on receipt, never returned.
  string value = 3;
  string description = 4;
}

message CreateSecretResponse { Secret secret = 1; }

message ListSecretsRequest { scylla.common.v1.ProjectId project_id = 1; }

message ListSecretsResponse { repeated Secret secrets = 1; }

message DeleteSecretRequest { scylla.common.v1.SecretId secret_id = 1; }

message DeleteSecretResponse {}
