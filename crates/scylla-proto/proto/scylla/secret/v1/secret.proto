syntax = "proto3";

package scylla.secret.v1;

import "google/protobuf/timestamp.proto";
import "scylla/common/v1/common.proto";

// Project-scoped secrets for pipeline environment variables. A pipeline node
// references a secret by name through EnvVar.secret_ref (pipeline.proto). The
// control plane encrypts the value on receipt and decrypts it only when it
// resolves a job's environment for dispatch. No RPC returns a value: Secret
// carries metadata only. There is no update RPC: to change a value or
// description, delete the secret and create it again with the same name.
service SecretService {
  // Requires `createSecret` on project_id. Fails with FAILED_PRECONDITION when
  // the control plane has no secret master key configured.
  rpc CreateSecret(CreateSecretRequest) returns (CreateSecretResponse);
  // Requires `listSecrets` on project_id. Returns every secret of the
  // project, sorted by name, without pagination.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  // Requires `deleteSecret` on the secret's project. The lookup runs before
  // the permission check: an unknown secret_id fails with NOT_FOUND first.
  // Pipelines that reference the deleted name keep the reference; their next
  // run fails at dispatch, and PipelineService.RunPipeline returns NOT_FOUND.
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
}

message Secret {
  scylla.common.v1.SecretId secret_id = 1;
  scylla.common.v1.ProjectId project_id = 2;
  string name = 3;
  string description = 4;
  google.protobuf.Timestamp created_at = 5;
  // Always equal to created_at: no RPC updates a secret in place.
  google.protobuf.Timestamp updated_at = 6;
}

message CreateSecretRequest {
  scylla.common.v1.ProjectId project_id = 1;
  // Trimmed; 1 to 128 bytes of ASCII letters, digits, '-', '_' and '.';
  // unique within the project.
  string name = 2;
  // Plaintext; the control plane encrypts it on receipt.
  string value = 3;
  string description = 4;
}

message CreateSecretResponse { Secret secret = 1; }

message ListSecretsRequest { scylla.common.v1.ProjectId project_id = 1; }

message ListSecretsResponse { repeated Secret secrets = 1; }

message DeleteSecretRequest { scylla.common.v1.SecretId secret_id = 1; }

message DeleteSecretResponse {}
