syntax = "proto3";

package scylla.user.v1;

import "google/protobuf/timestamp.proto";
import "scylla/common/v1/common.proto";

// User accounts. A user reads and updates its own account without a grant.
// This service does not assign roles: bind one with
// scylla.authz.v1.GrantService.CreateGrant. No RPC in this service changes a
// password, an email or the is_active flag.
service UserService {
  // Requires `createUser` at system scope. The new account is active and
  // holds no grant.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  // Requires `readUser` on user_id, or user_id equal to the caller's own id.
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  // Requires `updateUser` on user_id, or user_id equal to the caller's own
  // id. Only the username can change.
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  // Requires `deleteUser` on user_id; the caller's own id gets no exemption.
  // Also deletes the user's sessions, OAuth identities and the invitations it
  // sent, and removes every grant the user holds. Authorization reflects the
  // removal at once.
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  // Requires `listUsers` at system scope. Every account, newest first.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
}

// A user account. No response carries the password hash.
message User {
  scylla.common.v1.UserId user_id = 1;
  string username = 2;
  // Absent only when CreateUser omitted it; Signup, invitation acceptance and
  // OAuth sign-in always set it.
  optional scylla.common.v1.Email email = 3;
  // False blocks AuthService.Login with UNAUTHENTICATED. New accounts are
  // active; no RPC changes the flag.
  bool is_active = 4;
  google.protobuf.Timestamp created_at = 5;
  // Equal to created_at until an UpdateUser call that carries a username.
  google.protobuf.Timestamp updated_at = 6;
}

message CreateUserRequest {
  // Trimmed; 1 to 255 bytes; unique across accounts.
  string username = 1;
  // Plaintext; 8 to 255 characters; not whitespace only. The server stores
  // it as a hash and never returns it.
  string password = 2;
  // Unique across accounts when set.
  optional scylla.common.v1.Email email = 3;
}

message CreateUserResponse { User user = 1; }

message GetUserRequest { scylla.common.v1.UserId user_id = 1; }

message GetUserResponse { User user = 1; }

message UpdateUserRequest {
  scylla.common.v1.UserId user_id = 1;
  // Absent: unchanged. Same rules as CreateUserRequest.username; the server
  // accepts the current username.
  optional string username = 2;
}

message UpdateUserResponse { User user = 1; }

message DeleteUserRequest { scylla.common.v1.UserId user_id = 1; }

message DeleteUserResponse {}

message ListUsersRequest { scylla.common.v1.PaginationRequest pagination = 1; }

message ListUsersResponse {
  repeated User users = 1;
  scylla.common.v1.PaginationMetadata pagination = 2;
}
