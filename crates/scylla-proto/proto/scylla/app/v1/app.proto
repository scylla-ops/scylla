syntax = "proto3";

package scylla.app.v1;

import "google/protobuf/timestamp.proto";
import "scylla/common/v1/common.proto";

// Management of the Apps owned by an organization. A new App holds no grant:
// bind a role to it with GrantService.CreateGrant before it can act.
service AppService {
  // Requires `createApp` on the organization. Creates the App with one
  // enabled secret labelled "default" and returns its plaintext once.
  rpc CreateApp(CreateAppRequest) returns (CreateAppResponse);
  // Requires `readApp` on the App.
  rpc GetApp(GetAppRequest) returns (GetAppResponse);
  // Requires `listAppsByOrganization` on the organization.
  rpc ListApps(ListAppsRequest) returns (ListAppsResponse);
  // Requires `deleteApp` on the App. Deletes the App with its secrets, its
  // tokens and its grants. Once the check passes, an unknown app_id succeeds.
  // Requests made with one of those tokens fail with UNAUTHENTICATED from
  // then on.
  rpc DeleteApp(DeleteAppRequest) returns (DeleteAppResponse);
  // Requires `deleteApp` on the App. With is_active false, the App's tokens
  // fail on their next request, AppAuthService.IssueToken fails and the
  // server closes the App's open AgentService.Open stream. True restores the
  // unexpired tokens.
  rpc SetAppActive(SetAppActiveRequest) returns (SetAppActiveResponse);

  // Requires `deleteApp` on the App. Adds one more enabled secret and returns
  // its plaintext once.
  rpc CreateAppSecret(CreateAppSecretRequest) returns (CreateAppSecretResponse);
  // Requires `readApp` on the App. Metadata only, never a plaintext. Once the
  // check passes, an unknown app_id yields an empty list.
  rpc ListAppSecrets(ListAppSecretsRequest) returns (ListAppSecretsResponse);
  // Requires `deleteApp` on the secret; a grant on the organization of its
  // App reaches it. An unknown `app_secret_id` has no App: it fails with
  // PERMISSION_DENIED, and with NOT_FOUND only for a System grant. Deletes the
  // secret and its tokens and closes the App's open AgentService.Open stream.
  // Revokes the last secret too; the App then cannot authenticate until
  // CreateAppSecret adds one.
  rpc RevokeAppSecret(RevokeAppSecretRequest) returns (RevokeAppSecretResponse);
  // Requires `deleteApp` on the secret, as RevokeAppSecret, with the same
  // errors for an unknown `app_secret_id`. A disabled secret is kept, but
  // AppAuthService.IssueToken rejects its plaintext and its tokens fail on
  // their next request. The server also closes the App's open
  // AgentService.Open stream. Enabling it restores the plaintext and its
  // unexpired tokens.
  rpc SetAppSecretEnabled(SetAppSecretEnabledRequest) returns (SetAppSecretEnabledResponse);
}

// No RPC renames an App or moves it to another organization: recreate it.
message App {
  scylla.common.v1.AppId app_id = 1;
  scylla.common.v1.OrganizationId organization_id = 2;
  // Unique within the organization.
  string name = 3;
  // True at creation. Only SetAppActive changes it.
  bool is_active = 4;
  google.protobuf.Timestamp created_at = 5;
  // Bumped by SetAppActive.
  google.protobuf.Timestamp updated_at = 6;
}

message AppSecret {
  scylla.common.v1.AppSecretId app_secret_id = 1;
  scylla.common.v1.AppId app_id = 2;
  // Unique within the App.
  string label = 3;
  // True at creation. Only SetAppSecretEnabled changes it.
  bool enabled = 4;
  google.protobuf.Timestamp created_at = 5;
  // Bumped by SetAppSecretEnabled.
  google.protobuf.Timestamp updated_at = 6;
}

message CreateAppRequest {
  scylla.common.v1.OrganizationId organization_id = 1;
  // Trimmed; 1 to 255 bytes; unique within the organization.
  string name = 2;
}

message CreateAppResponse {
  App app = 1;
  // 64 lowercase hex characters; returned only here.
  string secret = 2;
}

message GetAppRequest { scylla.common.v1.AppId app_id = 1; }

message GetAppResponse { App app = 1; }

message ListAppsRequest { scylla.common.v1.OrganizationId organization_id = 1; }

// Every App of the organization, active or not, newest first. No pagination.
message ListAppsResponse { repeated App apps = 1; }

message DeleteAppRequest { scylla.common.v1.AppId app_id = 1; }

message DeleteAppResponse {}

message SetAppActiveRequest {
  scylla.common.v1.AppId app_id = 1;
  bool is_active = 2;
}

// The App as stored after the change.
message SetAppActiveResponse { App app = 1; }

message CreateAppSecretRequest {
  scylla.common.v1.AppId app_id = 1;
  // Trimmed; 1 to 64 bytes; unique within the App.
  string label = 2;
}

message CreateAppSecretResponse {
  AppSecret app_secret = 1;
  // Same format and rules as CreateAppResponse.secret.
  string secret = 2;
}

message ListAppSecretsRequest { scylla.common.v1.AppId app_id = 1; }

// Every secret of the App, enabled or not, newest first. No pagination.
message ListAppSecretsResponse { repeated AppSecret app_secrets = 1; }

message RevokeAppSecretRequest { scylla.common.v1.AppSecretId app_secret_id = 1; }

message RevokeAppSecretResponse {}

message SetAppSecretEnabledRequest {
  scylla.common.v1.AppSecretId app_secret_id = 1;
  bool enabled = 2;
}

// The secret's metadata as stored after the change.
message SetAppSecretEnabledResponse { AppSecret app_secret = 1; }
