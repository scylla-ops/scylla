syntax = "proto3";

package scylla.common.v1;

// Value objects shared by every Scylla service. This package imports nothing;
// any other package may import it.
//
// The rules below apply to every Scylla RPC. Other files state only what
// differs from them.
//
// Authentication. Every RPC reads the `authorization` metadata header and
// expects the value `Bearer <token>`. The token is a user session token or
// an app token. scylla.auth.v1.AuthService.Login,
// scylla.registration.v1.RegistrationService.Signup,
// scylla.invitation.v1.InvitationAcceptService.AcceptInvitation and
// scylla.oauth.v1.OauthService.Callback return a session token.
// scylla.app.v1.AppAuthService.IssueToken returns an app token. A missing,
// malformed, unknown or expired token fails with UNAUTHENTICATED before the
// handler runs. The public services skip this check: AuthService,
// AppAuthService, RegistrationService, InvitationAcceptService and
// OauthService.
//
// Authorization. Each RPC comment names the permission key it requires. The
// server checks that permission before it looks the resource up. A caller
// that lacks the permission fails with PERMISSION_DENIED, also when the id is
// unknown. The server returns NOT_FOUND only after the check passes.
//
// Ids. Each id wraps a single `value`. Unless the message says otherwise, the
// value is a lowercase ULID: 26 characters of Crockford base32, for example
// `01hb2k...`. The server generates it. It sorts by creation time and is
// case-sensitive. Send it back unchanged; do not parse or upper-case it. An
// RPC that requires an id rejects a missing id message with INVALID_ARGUMENT.
//
// Validation. A request that breaks a validation rule fails with
// INVALID_ARGUMENT. A request that would duplicate a unique value fails with
// ALREADY_EXISTS.
//
// Responses. The server sets every field of a response message unless the
// field's own comment says otherwise. Timestamps use
// `google.protobuf.Timestamp`.

message UserId { string value = 1; }
// The top-level tenant. Projects, apps and invitations each belong to one
// organization.
message OrganizationId { string value = 1; }
// A project belongs to one organization and owns pipelines and secrets.
message ProjectId { string value = 1; }
// A pipeline is the stored node graph inside a project. It is the definition,
// not a run; one run is a Job.
message PipelineId { string value = 1; }
// One run of a pipeline. PipelineService.RunPipeline and
// TriggerService.FireTriggerNow return it. Read the run with JobService.GetJob.
message JobId { string value = 1; }
// One captured output line of a job. Only JobLogEntry carries it; no RPC
// takes it.
message JobLogId { string value = 1; }
// A machine principal owned by an organization. It authenticates with one of
// its secrets through AppAuthService.IssueToken.
message AppId { string value = 1; }
// One credential of an app. The server stores only a hash. It returns the
// plaintext once: in AppService.CreateAppResponse.secret for the first
// secret, in AppService.CreateAppSecretResponse.secret for each later one.
// Use this id with AppService.RevokeAppSecret and
// AppService.SetAppSecretEnabled.
message AppSecretId { string value = 1; }
// An invitation to join an organization. Not the acceptance credential:
// InvitationAcceptService.AcceptInvitation takes the token sent by email.
message InvitationId { string value = 1; }
// A project secret. Distinct from AppSecretId. A pipeline references a secret
// by name through `EnvVar.secret_ref`, not by this id.
message SecretId { string value = 1; }
// A trigger belongs to one pipeline and starts runs of it. Each fire creates a
// Job.
message TriggerId { string value = 1; }
// One grant: a principal holds a role within a scope. GrantService.CreateGrant
// returns it; GrantService.RevokeGrant takes it.
message GrantId { string value = 1; }
// Not always a ULID. A builtin role's id is its stable key, for example
// `organization-admin`. A custom role created with RoleService.CreateRole gets
// a lowercase ULID. Grants and invitations reference a role by this id.
message RoleId { string value = 1; }
// Not a ULID: the caller chooses it. The server trims surrounding whitespace
// and accepts a non-empty value of at most 128 lowercase ASCII letters,
// digits, `-` and `_`. It must be unique within its pipeline. The server
// rejects any other value.
message NodeId { string value = 1; }

// The server trims and lowercases the value on receipt. It accepts at most
// 320 bytes in which the first `@` separates a non-empty local part from a
// domain. The domain contains a dot and does not start or end with one. The
// server rejects any other value. Values the server returns are already
// lowercase.
message Email { string value = 1; }

// The process output stream that produced a log line. Lines the server
// returns always carry STDOUT or STDERR. The server stores a line appended
// with UNSPECIFIED or an unknown value as STDOUT.
enum LogStream {
  LOG_STREAM_UNSPECIFIED = 0;
  LOG_STREAM_STDOUT      = 1;
  LOG_STREAM_STDERR      = 2;
}

// Offset pagination for every List RPC that takes it. When the message is
// absent the server serves page 1 with 20 items. The server does not clamp a
// page_size above 100: it ignores the whole request and serves page 1 with 20
// items. The response's PaginationMetadata reports the values actually used.
message PaginationRequest {
  // 1-indexed. 0 means page 1.
  uint32 page = 1;
  // 0 means 20. Maximum 100; a larger value makes the server ignore the whole
  // request and serve page 1 with 20 items.
  uint32 page_size = 2;
}

// The pagination the server applied. It can differ from the request; see
// PaginationRequest.
message PaginationMetadata {
  // Total matching items, not only those on this page.
  uint32 total_count = 1;
  // The page served: the requested page, or 1 when the request was absent or
  // rejected.
  uint32 page = 2;
  // The page size served: the requested size, or 20 when the request was
  // absent or rejected.
  uint32 page_size = 3;
  // ceil(total_count / page_size). 0 when total_count is 0.
  uint32 total_pages = 4;
  // True when page < total_pages.
  bool has_next = 5;
  // True when page > 1, even when page is beyond total_pages.
  bool has_previous = 6;
}
