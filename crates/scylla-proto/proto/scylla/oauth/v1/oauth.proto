syntax = "proto3";

package scylla.oauth.v1;

import "scylla/common/v1/common.proto";

// GitHub OAuth login. Both RPCs are public: the server skips the
// bearer-token check for them entirely, since no session exists yet. Call
// GetAuthUrl and redirect the browser to the URL; GitHub redirects it to the
// server's configured redirect URI with a `code` query parameter; pass that
// code to Callback. The server registers this service only when its
// configuration has GitHub OAuth; elsewhere both RPCs fail with UNIMPLEMENTED.
service OauthService {
  // Builds the GitHub authorize URL for the server's client id and redirect
  // URI, with the `read:user` and `user:email` scopes.
  rpc GetAuthUrl(GetAuthUrlRequest) returns (GetAuthUrlResponse);
  // Exchanges the code for a session and links or provisions the account.
  // The GitHub email is the profile's public email, or else the account's
  // primary verified email. Fails with INTERNAL when GitHub rejects the
  // code. Fails with UNAUTHENTICATED when the matched account is
  // deactivated. Fails with INVALID_ARGUMENT when a first login has no
  // usable email. Fails with ALREADY_EXISTS when the GitHub login is
  // already a username.
  rpc Callback(CallbackRequest) returns (CallbackResponse);
}

message GetAuthUrlRequest {
  // The server copies it verbatim into the `state` query parameter of the
  // authorize URL. It does not validate or store it, and Callback does not
  // take it. Compare the `state` GitHub returns with the value sent before
  // calling Callback. Empty is accepted.
  string state = 1;
}

// `url` is the full GitHub authorize URL. Redirect the browser to it.
message GetAuthUrlResponse { string url = 1; }

// `code` is the `code` query parameter GitHub appended to the redirect URI.
message CallbackRequest { string code = 1; }

message CallbackResponse {
  // Opaque session token. The session expires 24 hours after this call.
  string token = 1;
  scylla.common.v1.UserId user_id = 2;

  // Always set. NewAccount on a first login that provisioned an account;
  // ExistingAccount when the login resolved to an account that already
  // existed.
  oneof outcome {
    NewAccount new_account = 10;
    ExistingAccount existing_account = 11;
  }

  // No linked GitHub identity and no account with the GitHub email existed.
  // The server created a user with the GitHub login as username and the
  // GitHub email as email, then linked the identity to it. It created an
  // organization named "<login>'s organization" (organization_id) and
  // granted the user the organization-admin role on it.
  message NewAccount { scylla.common.v1.OrganizationId organization_id = 1; }
  // The GitHub identity was already linked to an account, or the GitHub email
  // matched an existing account's email. In the second case the server links
  // the identity to that account, so later logins match by identity.
  message ExistingAccount {}
}
