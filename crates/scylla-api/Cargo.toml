[package]
name = "scylla-api"
version = "0.1.0"
edition = "2024"

[features]
default = ["grpc"]
grpc = [
    "dep:tonic",
    "dep:tonic-web",
    "dep:tonic-reflection",
    "dep:tonic-async-interceptor",
    "dep:protocol",
]
rest = ["dep:axum", "dep:serde_json", "dep:utoipa", "dep:utoipa-swagger-ui"]

[dependencies]
# shared
scylla-core = { workspace = true, features = ["surrealdb", "hash", "permission"] }
tokio.workspace = true
async-trait.workspace = true
tower.workspace = true
tower-http.workspace = true
http.workspace = true
serde.workspace = true
toml.workspace = true
clap.workspace = true
anyhow.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
derive_more.workspace = true
uuid.workspace = true
ulid.workspace = true
surrealdb.workspace = true
surreal-casbin-adapter.workspace = true
log.workspace = true

# grpc-only (optional)
tonic = { workspace = true, optional = true }
tonic-web = { workspace = true, optional = true }
tonic-reflection = { workspace = true, optional = true }
tonic-async-interceptor = { workspace = true, optional = true }
protocol = { workspace = true, optional = true }

# rest-only (optional)
axum = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
utoipa-swagger-ui = { workspace = true, optional = true }
