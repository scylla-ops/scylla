[package]
name = "scylla-api"
version = "0.1.0"
edition = "2024"

[features]
default = ["grpc"]
grpc = [
    "dep:tonic",
    "dep:tonic-web",
    "dep:tonic-reflection",
    "dep:tonic-async-interceptor",
    "dep:scylla-protocol",
]

[dependencies]
# shared
scylla-core = { workspace = true, features = ["postgres", "hash", "permission"] }
tokio.workspace = true
async-trait.workspace = true
tower.workspace = true
tower-http.workspace = true
http.workspace = true
serde.workspace = true
toml.workspace = true
chrono.workspace = true
tracing.workspace = true
derive_more.workspace = true
thiserror.workspace = true

# broker
hermes-broker-client = { workspace = true }
tokio-stream = { workspace = true }
futures-util.workspace = true
serde_json.workspace = true

# database
sqlx.workspace = true

# grpc-only (optional)
tonic = { workspace = true, optional = true }
tonic-web = { workspace = true, optional = true }
tonic-reflection = { workspace = true, optional = true }
tonic-async-interceptor = { workspace = true, optional = true }
scylla-protocol = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
tonic = { workspace = true }
scylla-protocol = { workspace = true }
tokio-stream = { workspace = true }
tonic-async-interceptor = { workspace = true }
scylla-core = { workspace = true, features = ["postgres", "hash", "permission", "test-utils"] }

[lints]
workspace = true
