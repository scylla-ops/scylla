[grpc]
address = "0.0.0.0:50051"

[database]
url = "rocksdb:///data/scylla.db"
namespace = "scylla"
database = "core"

[cors]
allow_origins = ["http://localhost:5173"]
allow_headers = [
    "content-type",
    "authorization",
    "x-grpc-web",
    "x-user-agent"
]
expose_headers = [
    "grpc-status",
    "grpc-message",
    "grpc-status-details-bin"
]

[bootstrap]
username = "admin"
password = "admin123"
