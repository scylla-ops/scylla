[package]
name = "scylla-recorder"
version = "0.1.0"
edition = "2024"

[dependencies]
# domain + persistence
scylla-core = { workspace = true, features = ["surrealdb", "jobs", "agents"] }

# broker
hermes-broker-client = { workspace = true }

# async
tokio = { workspace = true }

# grpc (Channel type used by hermes-broker-client)
tonic = { workspace = true }

# serialization
serde_json = { workspace = true }

# cli
clap = { workspace = true }

# error handling
anyhow = { workspace = true }

# logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# time
chrono = { workspace = true }
