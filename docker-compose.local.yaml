services:
  db:
    image: surrealdb/surrealdb:latest-dev
    container_name: surrealdb
    command:
      - start
      - --log=debug
      - --user=root
      - --pass=secret
      - rocksdb:/data/database
    ports:
      - "8000:8000"
    volumes:
      - db_data:/data:rw

  core:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: scylla-core
    depends_on:
      db:
        condition: service_started
    ports:
      - "50051:50051"   # gRPC
    environment:
      RUST_LOG: info
    command: [ "--config", "/app/config/docker.toml" ]
    volumes:
      - ./apps/server/config:/app/config


volumes:
  db_data: