# SaaS edition overlay. Use ON TOP of docker-compose.yaml to build/run the
# control-plane SaaS edition instead of the default PaaS one.
#
# It points the control-plane at the `-saas` image tags pushed by
# `just release` (e.g. :latest-saas, :0.3.0-saas) and flips the FEATURES
# build-arg for local builds — same ./Dockerfile, the base compose already
# sets PACKAGE=scylla-control-plane. The distinct tag also means a locally
# built SaaS image no longer overwrites the PaaS :latest one.
#
#   just up-saas      # pull released SaaS images and start
#   just local-saas   # build the SaaS edition locally
#   just start-saas   # start from already-present images
#
# The base compose file alone still runs the PaaS edition (:latest, FEATURES
# empty).
services:
  scylla-control-plane:
    image: ${DOCKER_USER:-godlyjaaaaj}/scylla-control-plane:${VERSION:-latest}-saas
    build:
      args:
        FEATURES: saas
