[package]
name = "scylla-core"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.47.1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
serde = { version = "1.0.219", features = ["derive"] }
protocol = { path = "../../libs/protocol" }
anyhow = "1.0.99"
thiserror = "2.0.16"
clap = { version = "4.5.47", features = ["derive"] }
argon2 = "0.6.0-rc.1"
pasetors = "0.7.7"
# Database dependencies
surrealdb = { version = "2.3.9", features = ["kv-mem"] }
chrono = { version = "0.4.42", features = ["serde"] }
# Validation
async-trait = "0.1.89"
tonic-reflection = "0.14.2"
derive_more = { version = "2.0.1", features = ["full"] }
derive_builder = "0.20.2"
sha2 = "0.11.0-rc.2"
tower-http = { version = "0.6.6", features = ["trace"]}
tokio-stream = "0.1.17"
# RBAC dependencies
surreal-casbin-adapter = { path = "../../libs/surreal-casbin-adapter" }
casbin = { version = "2.13.0" }
uuid = { version = "1.18.1", features = ["v4"] }
surrealdb-migrations = "2.3.0"
include_dir = "0.7.4"
tonic-web = "0.14.2"

[dev-dependencies]
tokio = { version = "1.47.1", features = ["full", "test-util"] }
serde_json = "1.0"

[features]
# Enable gRPC server reflection service by default; you can build without it using `--no-default-features`.
default = ["reflection", "surreal"]
reflection = []
surreal = []
