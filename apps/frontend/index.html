<!doctype html>
<html lang="en">
  <head>
    <script>
      (() => {
        const theme = localStorage.getItem('scylla-theme');
        document.documentElement.classList.toggle(
                'dark',
                theme !== 'light'
        );
      })();
    </script>
    <style>
      /* Both hexes are `--sidebar` from src/index.css — the app's base surface —
         inlined so the first paint is not white: the stylesheet has not loaded
         yet at this point. Keep them in sync with it. `html` is what shows
         through wherever no element reaches (the stable scrollbar gutter,
         overscroll), so a mismatch shows up as a band along the edge. */
      html {
        background: #141412;
      }

      html:not(.dark) {
        background: #EFF2E7;
      }

      body {
        margin: 0;
        background: inherit;
      }
    </style>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Scylla_Beta_Log.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scylla Beta 0.4</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
