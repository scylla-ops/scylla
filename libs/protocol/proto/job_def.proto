syntax = "proto3";

package job_def;

message JobContent {
  string name = 1;
  map<string, JobStageContent> stages = 2;
}

message JobStageContent {
  string description = 1;
  repeated JobStepContent steps = 2;
}

message JobStepContent {
  string name = 1;
  string command = 2;
  repeated string args = 3;
}