syntax = "proto3";

package job;

message CreateJobRequest {
  string pipeline_id = 1; // UUID of the pipeline to execute
}

message CreateJobResponse {
  string job_id = 1; // UUID of the job created
  string snapshot_id = 2; // UUID of the snapshot used
}

service JobService {
  rpc CreateJob (CreateJobRequest) returns (CreateJobResponse);
  //rpc GetJob (GetJobRequest) returns (JobResponse);
  //rpc ListJobs (ListJobsRequest) returns (ListJobsResponse);
  //rpc UpdateJob (UpdateJobRequest) returns (JobResponse);
  //rpc DeleteJob (DeleteJobRequest) returns (DeleteJobResponse);
}