syntax = "proto3";

package orchestrator;

message Job {
  string job_toml = 2; // job definition in TOML format
}

message WorkerId {
  string id = 1;
}

enum EventKind {
  Queued = 0;
  Running = 1;
  Succeeded = 2;
  Failed = 3;
  Canceled = 4;
}

message PipelineEvent {
  oneof event {
    JobEvent job = 1;
    StageEvent stage = 2;
    StepEvent step = 3;
  }
  EventKind kind = 4;
  string id = 5;
}

message JobEvent {
}

message StageEvent {
}

message StepEvent {
}

message Ack {}

message HealthStatus {
  WorkerId id = 1;
  enum WorkerState {
    UNDEFINED = 0;
    IDLE = 1;
    BUSY = 2;
  }
  WorkerState state = 3;
}

service Orchestrator {
  rpc SubscribeJobs(WorkerId) returns (stream Job);
  rpc ReportStatus(stream PipelineEvent) returns (Ack);
  rpc ReportHealth(HealthStatus) returns (Ack);
}