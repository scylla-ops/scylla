syntax = "proto3";

package orchestrator;

service Orchestrator {
  rpc RunPipeline(RunPipelineRequest) returns (RunPipelineResponse);
}

message RunPipelineRequest { string pipeline_id = 1; }

message RunPipelineResponse { string job_id = 1; }

