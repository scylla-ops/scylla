[package]
name = "surreal-casbin-adapter"
version = "3.0.1"
edition = "2024"
authors = ["Scylla Contributors"]
description = "A SurrealDB adapter for casbin-rs - an authorization library that supports access control models like ACL, RBAC, ABAC"
license = "Apache-2.0"
keywords = ["casbin", "surrealdb", "authorization", "rbac", "acl"]
categories = ["authentication", "database"]

[lib]
doctest = false

[dependencies]
casbin = { workspace = true }
surrealdb = { workspace = true }
surrealdb-types = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
surrealdb = { workspace = true, features = ["kv-mem"] }

[features]
default = []
