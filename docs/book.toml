[book]
title = "The Scylla Book"
authors = ["Sébastien LUCAS"]
description = "Documentation for Scylla, a distributed CI/CD platform."
language = "en"
src = "src"

[output.html]
git-repository-url = "https://github.com/scylla-ops/scylla"
edit-url-template = "https://github.com/scylla-ops/scylla/edit/main/docs/{path}"
# Served as a GitHub Pages *project* site at https://scylla-ops.github.io/scylla/.
# Change this if the book ever moves to a custom domain or the org root.
site-url = "/scylla/"
default-theme = "navy"
preferred-dark-theme = "navy"

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
