## Build & promote backend Docker images on Blacksmith runners.
##
## - push to `back-end`  -> per-platform native build (amd64 + arm64) of changed services,
##                          push by-digest, then merge-manifest publishes :back-end + :back-end-<sha7>.
## - push to `dev`       -> retag (no rebuild) the back-end image at the merge source SHA as
##                          :dev + :dev-<sha7>. If no per-SHA image exists (e.g. a docs-only PR
##                          merged into dev without going through back-end), fall back to the
##                          floating :back-end tag — carrying the latest build forward.
## - push to `main`      -> retag the dev image at the merge source SHA as :latest + :main-<sha7>,
##                          with the same fallback to :dev when no per-SHA image exists.
##
## The workflow runs on every push to back-end/dev/main; `build` is still gated by
## `detect-changes`, so back-end pushes that don't touch crates/Dockerfile do nothing.
## Promotion expects PR merge commits (HEAD^2 = source branch tip).
## Required secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.

name: Backend images

on:
  push:
    branches: [back-end, dev, main]

env:
  IMAGE_PREFIX: godlyjaaaaj
  ALL_SERVICES: '["scylla-control-plane","scylla-agent"]'

jobs:
  verify-sqlx-cache:
    name: Verify .sqlx/ cache is up to date
    if: github.ref == 'refs/heads/back-end'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: scylla
          POSTGRES_PASSWORD: scylla
          POSTGRES_DB: scylla
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scylla"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://scylla:scylla@localhost:5432/scylla
    steps:
      - uses: actions/checkout@v6
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres --locked
      - name: Verify offline query cache
        run: cargo sqlx prepare --check --workspace -- --tests

  detect-changes:
    name: Detect changed services
    if: github.ref == 'refs/heads/back-end'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      services: ${{ steps.compose.outputs.list }}
    steps:
      - uses: actions/checkout@v6

      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            shared:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Dockerfile'
              - 'migrations/**'
              - '.sqlx/**'
              - 'crates/scylla-core/**'
              - 'crates/scylla-protocol/**'
            control-plane:
              - 'crates/scylla-api/**'
              - 'crates/scylla-control-plane/**'
            agent:
              - 'crates/scylla-agent/**'

      - id: compose
        run: |
          if [[ "${{ steps.filter.outputs.shared }}" == "true" ]]; then
            echo 'list=${{ env.ALL_SERVICES }}' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          svcs=()
          [[ "${{ steps.filter.outputs.control-plane }}" == "true" ]] && svcs+=('"scylla-control-plane"')
          [[ "${{ steps.filter.outputs.agent }}"         == "true" ]] && svcs+=('"scylla-agent"')
          if [[ ${#svcs[@]} -eq 0 ]]; then
            echo 'list=[]' >> "$GITHUB_OUTPUT"
          else
            IFS=,
            echo "list=[${svcs[*]}]" >> "$GITHUB_OUTPUT"
          fi

  cook-deps:
    name: Cook workspace deps (${{ matrix.platform.arch }})
    needs: detect-changes
    if: github.ref == 'refs/heads/back-end' && needs.detect-changes.outputs.services != '[]'
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { arch: amd64, runner: blacksmith-4vcpu-ubuntu-2404,       docker: linux/amd64 }
          - { arch: arm64, runner: blacksmith-4vcpu-ubuntu-2404-arm, docker: linux/arm64 }
    steps:
      - uses: actions/checkout@v6

      - uses: useblacksmith/setup-docker-builder@v1

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: Dockerfile
          target: deps
          platforms: ${{ matrix.platform.docker }}
          push: false
          provenance: false
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/scylla-deps:buildcache-${{ matrix.platform.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/scylla-deps:buildcache-${{ matrix.platform.arch }},mode=max,image-manifest=true,oci-mediatypes=true

  build:
    name: Build ${{ matrix.service }} (${{ matrix.platform.arch }})
    needs: [detect-changes, cook-deps]
    if: github.ref == 'refs/heads/back-end' && needs.detect-changes.outputs.services != '[]'
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
        platform:
          - { arch: amd64, runner: blacksmith-4vcpu-ubuntu-2404,       docker: linux/amd64 }
          - { arch: arm64, runner: blacksmith-4vcpu-ubuntu-2404-arm, docker: linux/arm64 }
    steps:
      - uses: actions/checkout@v6

      - uses: useblacksmith/setup-docker-builder@v1

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: build
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform.docker }}
          push: true
          provenance: false
          build-args: |
            PACKAGE=${{ matrix.service }}
            CARGO_BUILD_JOBS=2
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/${{ matrix.service }},push-by-digest=true,name-canonical=true
          cache-from: |
            type=registry,ref=${{ env.IMAGE_PREFIX }}/scylla-deps:buildcache-${{ matrix.platform.arch }}
            type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:buildcache-${{ matrix.platform.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:buildcache-${{ matrix.platform.arch }},mode=max,image-manifest=true,oci-mediatypes=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.service }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish ${{ matrix.service }} manifest
    needs: [detect-changes, build]
    if: github.ref == 'refs/heads/back-end' && needs.detect-changes.outputs.services != '[]'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.service }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          refs=()
          for f in *; do
            refs+=("${{ env.IMAGE_PREFIX }}/${{ matrix.service }}@sha256:${f}")
          done
          docker buildx imagetools create \
            -t ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:back-end \
            -t ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:back-end-${{ steps.sha.outputs.short }} \
            "${refs[@]}"

  promote-dev:
    name: Promote ${{ matrix.service }} to dev
    if: github.ref == 'refs/heads/dev'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        service: [scylla-control-plane, scylla-agent]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: refs
        run: |
          if ! SOURCE_FULL=$(git rev-parse HEAD^2 2>/dev/null); then
            echo "::error::HEAD on dev is not a merge commit. Promotion expects a PR merge commit from back-end."
            exit 1
          fi
          echo "source=${SOURCE_FULL::7}" >> "$GITHUB_OUTPUT"
          echo "current=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Retag back-end -> dev
        run: |
          src_sha="${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:back-end-${{ steps.refs.outputs.source }}"
          src_tip="${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:back-end"
          if docker buildx imagetools inspect "$src_sha" >/dev/null 2>&1; then
            src="$src_sha"
          elif docker buildx imagetools inspect "$src_tip" >/dev/null 2>&1; then
            echo "::notice::No image at $src_sha (non back-end merge?). Carrying forward $src_tip."
            src="$src_tip"
          else
            echo "::error::Neither $src_sha nor $src_tip exists. Push back-end first so an image gets built."
            exit 1
          fi
          docker buildx imagetools create \
            -t ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:dev \
            -t ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:dev-${{ steps.refs.outputs.current }} \
            "$src"

  promote-main:
    name: Promote ${{ matrix.service }} to main
    if: github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        service: [scylla-control-plane, scylla-agent]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: refs
        run: |
          if ! SOURCE_FULL=$(git rev-parse HEAD^2 2>/dev/null); then
            echo "::error::HEAD on main is not a merge commit. Promotion expects a PR merge commit from dev."
            exit 1
          fi
          echo "source=${SOURCE_FULL::7}" >> "$GITHUB_OUTPUT"
          echo "current=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Retag dev -> main
        run: |
          src_sha="${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:dev-${{ steps.refs.outputs.source }}"
          src_tip="${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:dev"
          if docker buildx imagetools inspect "$src_sha" >/dev/null 2>&1; then
            src="$src_sha"
          elif docker buildx imagetools inspect "$src_tip" >/dev/null 2>&1; then
            echo "::notice::No image at $src_sha. Carrying forward $src_tip."
            src="$src_tip"
          else
            echo "::error::Neither $src_sha nor $src_tip exists. Promote to dev first."
            exit 1
          fi
          docker buildx imagetools create \
            -t ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest \
            -t ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:main-${{ steps.refs.outputs.current }} \
            "$src"
