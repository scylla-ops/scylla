name: Frontend

# Typecheck, lint, architecture boundaries and build for apps/frontend.
# Also triggers on the proto crate: the TS gRPC clients are generated from it at
# build time and are not committed, so a proto change can break the frontend
# without touching a single file under apps/frontend/.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/frontend/**"
      - "crates/scylla-proto/proto/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/frontend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same reasoning as apps/frontend/Dockerfile: give @protobuf-ts/protoc a
      # system protoc so it never reaches out to GitHub mid-build. protobuf-dev
      # ships the well-known types (google/protobuf/timestamp.proto) under
      # /usr/include, which protoc resolves automatically.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # src/generated is gitignored, so nothing below can run without this.
      - name: Generate proto clients
        run: pnpm run gen-proto

      - name: Compile locale catalogs
        run: pnpm run compile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      # Both are hard gates: the module graph is cycle-free and rule-clean as of
      # the boundary refactor, and regressing it should fail the build.
      - name: Architecture boundaries
        run: pnpm run depcruise

      - name: Module cycles
        run: pnpm run depcruise:cycles

      # Catalogs are per-module but merged into one flat map at runtime, so a
      # msgid shared by two modules resolves to whichever catalog loads last —
      # app-wide. An untranslated twin silently wins and renders English.
      #
      # Extract first (tolerated failure, as in `prebuild`): the check reads the
      # .po files, so without this a string added to source but never extracted
      # would be invisible to it and the collision would land on main.
      - name: Catalog collisions
        run: (pnpm run extract || true) && pnpm run i18n:collisions

      - name: Build
        run: pnpm run build
