version: v2
modules:
  - path: crates/scylla-protocol/proto
lint:
  use:
    - STANDARD
  except:
    # STANDARD wants every RPC to take `<RpcName>Request` and return
    # `<RpcName>Response`. That naming is right for unary calls and is applied
    # everywhere else, but the agent channel is a long-lived bidirectional
    # stream: its messages are a protocol of events flowing in each direction,
    # not one request and one reply. `AgentUp` / `AgentDown` say which way a
    # frame travels; `OpenRequest` / `OpenResponse` would say nothing.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  # FILE is the strict default: it also catches a type moving between files,
  # which changes the wire contract for anyone generating per-file.
  use:
    - FILE
