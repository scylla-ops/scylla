services:
  postgres:
    image: postgres:18-alpine
    container_name: scylla-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scylla}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scylla}
      POSTGRES_DB: ${POSTGRES_DB:-scylla}
    ports:
      - "5432:5432"
    volumes:
      # PG 18+ stores data under /var/lib/postgresql/<major>/ — mounting the
      # parent dir keeps `pg_upgrade --link` viable when moving to PG 19+.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scylla} -d ${POSTGRES_DB:-scylla}"]
      interval: 5s
      timeout: 3s
      retries: 10

  scylla-broker:
    image: ${DOCKER_USER:-godlyjaaaaj}/scylla-broker:${VERSION:-latest}
    build:
      context: .
      args:
        PACKAGE: scylla-broker
    container_name: scylla-broker
    ports:
      - "50052:50052"
    environment:
      RUST_LOG: info

  scylla-api:
    image: ${DOCKER_USER:-godlyjaaaaj}/scylla-api:${VERSION:-latest}
    build:
      context: .
      args:
        PACKAGE: scylla-api
    container_name: scylla-api
    ports:
      - "50051:50051"
    environment:
      RUST_LOG: info
      # Override DatabaseConfig.url via the env so we don't ship a checked-in secret.
      DATABASE_URL: postgres://${POSTGRES_USER:-scylla}:${POSTGRES_PASSWORD:-scylla}@postgres:5432/${POSTGRES_DB:-scylla}
    command: ["--config", "/app/config/docker.toml"]
    volumes:
      - ./crates/scylla-api/config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      scylla-broker:
        condition: service_started

  scylla-frontend:
    image: ${DOCKER_USER:-godlyjaaaaj}/scylla-frontend:${VERSION:-latest}
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:50051}
    container_name: scylla-frontend
    ports:
      - "8080:80"
    depends_on:
      scylla-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  scylla-recorder:
    image: ${DOCKER_USER:-godlyjaaaaj}/scylla-recorder:${VERSION:-latest}
    build:
      context: .
      args:
        PACKAGE: scylla-recorder
    container_name: scylla-recorder
    environment:
      RUST_LOG: info
    command:
      - "--broker-url"
      - "http://scylla-broker:50052"
      - "--db-url"
      - "postgres://${POSTGRES_USER:-scylla}:${POSTGRES_PASSWORD:-scylla}@postgres:5432/${POSTGRES_DB:-scylla}"
    depends_on:
      postgres:
        condition: service_healthy
      scylla-broker:
        condition: service_started

  scylla-agent:
    image: ${DOCKER_USER:-godlyjaaaaj}/scylla-agent:${VERSION:-latest}
    build:
      context: .
      args:
        PACKAGE: scylla-agent
    container_name: scylla-agent
    environment:
      RUST_LOG: info
    command:
      - "--broker-url"
      - "http://scylla-broker:50052"
    depends_on:
      scylla-broker:
        condition: service_started

volumes:
  postgres_data:
