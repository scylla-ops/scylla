services:
  postgres:
    image: postgres:18-alpine
    container_name: scylla-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scylla}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scylla}
      POSTGRES_DB: ${POSTGRES_DB:-scylla}
    ports:
      # Bind to loopback only: services reach Postgres over the compose network
      # (postgres:5432); the host publish is for local tooling, not the world.
      - "127.0.0.1:5432:5432"
    volumes:
      # PG 18+ stores data under /var/lib/postgresql/<major>/ — mounting the
      # parent dir keeps `pg_upgrade --link` viable when moving to PG 19+.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scylla} -d ${POSTGRES_DB:-scylla}"]
      interval: 5s
      timeout: 3s
      retries: 10

  scylla-control-plane:
    image: ${DOCKER_USER:-godlyjaaaaj}/scylla-control-plane:${VERSION:-latest}
    build:
      context: .
      args:
        PACKAGE: scylla-control-plane
    container_name: scylla-control-plane
    # 50051 = gRPC API (user APIs, app token exchange, and the agent worker
    # stream). Agents connect here — there is no separate broker port.
    # 8088 = inbound webhook ingress (POST /webhooks/{trigger_id}).
    ports:
      - "50051:50051"
      - "8088:8088"
    environment:
      # RUST_LOG is deliberately NOT set here, so the binary's own default filter
      # applies (see main.rs): app logs at info, authorization grants silenced,
      # denials kept. A bare `RUST_LOG: info` overrode all of that and turned the
      # audit trail back into one line per authorized call.
      # To investigate: `RUST_LOG=audit=info docker compose up scylla-control-plane`.
      # Override DatabaseConfig.url via env so secrets stay out of the image.
      DATABASE_URL: postgres://${POSTGRES_USER:-scylla}:${POSTGRES_PASSWORD:-scylla}@postgres:5432/${POSTGRES_DB:-scylla}
      # Project-secret master key. Inject a unique 64-hex-char value here (or in a
      # .env file) for any real deployment: left empty it falls back to the PUBLIC
      # dev key in docker.toml, which offers NO secret confidentiality.
      SCYLLA_MASTER_KEY: ${SCYLLA_MASTER_KEY:-}
    command: ["--config", "/app/config/docker.toml"]
    volumes:
      - ./crates/scylla-control-plane/config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy

  scylla-frontend:
    image: ${DOCKER_USER:-godlyjaaaaj}/scylla-frontend:${VERSION:-latest}
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:50051}
    container_name: scylla-frontend
    ports:
      - "8080:80"
    depends_on:
      scylla-control-plane:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Agents are NOT part of this stack. An agent is an "App" created in the UI;
  # the UI then shows ready-to-paste run commands (docker run with a workspace
  # volume, or cargo run from a checkout) with the app id and one-time secret
  # filled in. Credentials only exist after the App is created, so an agent
  # cannot be wired ahead of time here.

volumes:
  postgres_data:
