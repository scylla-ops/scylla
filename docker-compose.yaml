services:
  surrealdb-init:
    image: busybox
    container_name: scylla-surrealdb-init
    command: ["sh", "-c", "chown -R 65532:65532 /data"]
    volumes:
      - surrealdb_data:/data

  surrealdb:
    image: surrealdb/surrealdb:v3
    container_name: scylla-surrealdb
    command: start --user root --pass root rocksdb:/data/srdb.db
    ports:
      - "8000:8000"
    volumes:
      - surrealdb_data:/data
    depends_on:
      surrealdb-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/surreal", "isready"]
      interval: 5s
      timeout: 3s
      retries: 10

  scylla-broker:
    image: ${DOCKER_USER:-godlyjaaaaj}/scylla-broker:${VERSION:-latest}
    build:
      context: .
      args:
        PACKAGE: scylla-broker
    container_name: scylla-broker
    ports:
      - "50052:50052"
    environment:
      RUST_LOG: info

  scylla-api:
    image: ${DOCKER_USER:-godlyjaaaaj}/scylla-api:${VERSION:-latest}
    build:
      context: .
      args:
        PACKAGE: scylla-api
    container_name: scylla-api
    ports:
      - "50051:50051"
    environment:
      RUST_LOG: info
    command: ["--config", "/app/config/docker.toml"]
    volumes:
      - ./crates/scylla-api/config:/app/config:ro
    depends_on:
      surrealdb:
        condition: service_healthy
      scylla-broker:
        condition: service_started

  scylla-recorder:
    image: ${DOCKER_USER:-godlyjaaaaj}/scylla-recorder:${VERSION:-latest}
    build:
      context: .
      args:
        PACKAGE: scylla-recorder
    container_name: scylla-recorder
    environment:
      RUST_LOG: info
    command:
      - "--broker-url"
      - "http://scylla-broker:50052"
      - "--db-url"
      - "ws://surrealdb:8000"
      - "--db-namespace"
      - "scylla"
      - "--db-database"
      - "core"
      - "--db-username"
      - "root"
      - "--db-password"
      - "root"
    depends_on:
      surrealdb:
        condition: service_healthy
      scylla-broker:
        condition: service_started

  scylla-agent:
    image: ${DOCKER_USER:-godlyjaaaaj}/scylla-agent:${VERSION:-latest}
    build:
      context: .
      args:
        PACKAGE: scylla-agent
    container_name: scylla-agent
    environment:
      RUST_LOG: info
    command:
      - "--broker-url"
      - "http://scylla-broker:50052"
    depends_on:
      scylla-broker:
        condition: service_started

volumes:
  surrealdb_data:
