[package]
name = "scylla-control-plane"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true

# This package lives exactly two directories below the workspace root, and that
# depth is load-bearing: `sqlx::migrate!("../../migrations")` and every
# `#[sqlx::test(migrations = "../../migrations")]` resolve against
# CARGO_MANIFEST_DIR. Moving it one level deeper silently breaks all of them.

# The shipped binary. Its name is load-bearing: the Dockerfile builds
# `-p ${PACKAGE}` then copies `target/release/${PACKAGE}`, so the package name
# and the binary name must stay identical.
[[bin]]
name = "scylla-control-plane"
path = "src/main.rs"

[features]
# Public self-service signup (the gRPC RegistrationService). Off by default so a
# deployment stays invite-only / OAuth-only unless it opts in.
register = ["scylla-core/register"]

# Exposes the `test_support` seeders (and, through scylla-core, the builders).
# Only this crate consumes them today; the feature exists so an integration-test
# crate could without making them part of the normal build.
test-utils = ["scylla-core/test-utils"]

[dependencies]
# the shared kernel: domain model + the agent-facing event vocabulary
scylla-domain = { workspace = true }
# use cases, surfaces, configuration
scylla-core = { workspace = true }
tokio.workspace = true
async-trait.workspace = true
tower.workspace = true
tower-http.workspace = true
http.workspace = true
serde.workspace = true
chrono.workspace = true
tracing.workspace = true

# database
sqlx.workspace = true

# grpc
# `tls-connect-info` is what gives us `impl Connected for TlsStream<TcpStream>`,
# the bound `serve_with_incoming_shutdown` needs to accept our own rustls
# acceptor. Declared here rather than left to feature unification with
# scylla-agent: the Dockerfile builds `-p scylla-control-plane`, which does not
# unify with a sibling package.
tonic = { workspace = true, features = ["tls-connect-info"] }
tonic-web.workspace = true
tonic-reflection.workspace = true
tonic-async-interceptor.workspace = true
scylla-proto.workspace = true

# binary: cli, cancellation, top-level error reporting
clap.workspace = true
tokio-util.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true

[dev-dependencies]
tokio = { workspace = true }
# the in-memory builders and PermissionService doubles the seeders and the
# persistence tests build on
scylla-core = { workspace = true, features = ["test-utils"] }

[lints]
workspace = true
