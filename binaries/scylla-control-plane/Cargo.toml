[package]
name = "scylla-control-plane"
version = "0.1.0"
edition = "2024"

# This package lives exactly two directories below the workspace root, and that
# depth is load-bearing: `sqlx::migrate!("../../migrations")` and every
# `#[sqlx::test(migrations = "../../migrations")]` resolve against
# CARGO_MANIFEST_DIR. Moving it one level deeper silently breaks all of them.

# The shipped binary. Its name is load-bearing: the Dockerfile builds
# `-p ${PACKAGE}` then copies `target/release/${PACKAGE}`, so the package name
# and the binary name must stay identical.
[[bin]]
name = "scylla-control-plane"
path = "src/main.rs"

[features]
# Public self-service signup (the gRPC RegistrationService). Off by default so a
# deployment stays invite-only / OAuth-only unless it opts in.
register = []

# Exposes the `test_support` builders and seeders. Only this crate consumes them
# today; the feature exists so an integration-test crate could without making
# them part of the normal build.
test-utils = []

[dependencies]
# the shared kernel: domain model + the agent-facing event vocabulary
scylla-domain = { workspace = true }
tokio.workspace = true
async-trait.workspace = true
tower.workspace = true
tower-http.workspace = true
http.workspace = true
serde.workspace = true
toml.workspace = true
chrono.workspace = true
prost-types.workspace = true
tracing.workspace = true
derive_more.workspace = true
thiserror.workspace = true

tokio-stream = { workspace = true }
futures-util.workspace = true
serde_json.workspace = true

# the single HTTP surface: web UI, webhook ingress, healthz
axum.workspace = true
# the Vite build, compiled in. See build.rs and src/rest/ui.rs.
rust-embed.workspace = true

# database
sqlx.workspace = true

# adapters: password hashing, policy engine, secret encryption, webhook HMAC,
# outbound mail and OAuth. All of these used to sit in scylla-domain, where they
# were linked into the agent for no reason.
argon2.workspace = true
cedar-policy.workspace = true
chacha20poly1305.workspace = true
hmac.workspace = true
sha2.workspace = true
subtle.workspace = true
hex.workspace = true
lettre.workspace = true
oauth2.workspace = true
reqwest.workspace = true
croner.workspace = true
humantime-serde.workspace = true
uuid.workspace = true
bon.workspace = true
futures-core.workspace = true

# grpc
# `tls-connect-info` is what gives us `impl Connected for TlsStream<TcpStream>`,
# the bound `serve_with_incoming_shutdown` needs to accept our own rustls
# acceptor. Declared here rather than left to feature unification with
# scylla-agent: the Dockerfile builds `-p scylla-control-plane`, which does not
# unify with a sibling package.
tonic = { workspace = true, features = ["tls-connect-info"] }
tokio-rustls.workspace = true
tonic-web.workspace = true
tonic-reflection.workspace = true
tonic-async-interceptor.workspace = true
scylla-proto.workspace = true

# binary: cli, cancellation, top-level error reporting
clap.workspace = true
tokio-util.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
