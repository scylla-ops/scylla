[grpc]
address = "0.0.0.0:50051"

[webhook]
# Inbound webhook ingress (separate HTTP listener). POST /webhooks/{trigger_id}.
address = "0.0.0.0:8088"
# Base URL advertised in TriggerView.webhook_url (override for a real domain).
public_base_url = "http://localhost:8088"

[database]
url = "postgres://scylla:scylla@postgres:5432/scylla"
max_connections = 16
min_connections = 1
acquire_timeout = "30s"
run_migrations = true

[cors]
allow_origins = ["http://localhost:5173", "http://localhost:8080"]
allow_headers = [
    "content-type",
    "authorization",
    "x-grpc-web",
    "x-user-agent"
]
expose_headers = [
    "grpc-status",
    "grpc-message",
    "grpc-status-details-bin"
]

[bootstrap]
username = "admin"
password = "admin123"

[secrets]
# Dev-only master key for project-secret encryption. Replace + inject at deploy.
master_key = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
