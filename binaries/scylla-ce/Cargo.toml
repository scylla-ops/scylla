[package]
name = "scylla-ce"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true

# The Community Edition binary: a main.rs and the shipped configuration files.
# No business logic lives here; the server itself is `scylla-server`.
#
# The package name, the binary name, the Dockerfile stage name and the config
# directory path are load-bearing: the image is built with `--target scylla-ce`
# and docker-compose.yaml bind-mounts `binaries/scylla-ce/config`.
[[bin]]
name = "scylla-ce"
path = "src/main.rs"

[features]
# Public self-service signup (the gRPC RegistrationService). Off by default so a
# deployment stays invite-only / OAuth-only unless it opts in.
register = ["scylla-server/register"]

[dependencies]
# the configuration types and the default extension implementations
scylla-core = { workspace = true }
# the pool this binary opens and hands to the server
scylla-db = { workspace = true }
# the composition root, the server and the shared command line
scylla-server = { workspace = true }
# the Extensions bundle this edition fills in
scylla-extension = { workspace = true }

tokio.workspace = true
anyhow.workspace = true

[lints]
workspace = true
