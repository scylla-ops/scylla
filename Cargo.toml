[workspace]
resolver = "3"
members = [
    "crates/scylla-core",
    "crates/scylla-api",
    "crates/scylla-protocol",
    "crates/scylla-agent",
    "crates/scylla-control-plane",
]

[workspace.dependencies]
# async
tokio = { version = "1.5", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1.89"
futures-core = "0.3"
futures-util = "0.3"

# grpc / proto
tonic = { version = "0.14", features = ["server"] }
tonic-web = "0.14"
tonic-prost = "0.14"
tonic-reflection = "0.14"
prost = "0.14"
prost-types = "0.14"
tonic-prost-build = "0.14"
scylla-protocol = { path = "crates/scylla-protocol" }
tonic-async-interceptor = "0.14"

# serialization
serde = { version = "1", features = ["derive"] }
humantime-serde = "1"
toml = "1"

# database
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "chrono",
    "json",
] }

# workspace crates
scylla-core = { path = "crates/scylla-core", default-features = false }

# domain / utilities
thiserror = "2.0.18"
anyhow = "1.0.102"
chrono = "0.4"
# 5-field Vixie cron parsing + next-occurrence computation (UTC), chrono-native.
# Lives behind the CronSchedule application port; the domain stays library-free.
croner = "3"
ulid = "1.2.1"
uuid = { version = "1", features = ["v4"] }
derive_more = { version = "2.1.1", features = ["full"] }
nutype = { version = "0.7", features = ["serde"] }
bon = "3.9"
argon2 = "0.6.0-rc.8"
# Reversible AEAD for project secrets (decrypted at dispatch). XChaCha20-Poly1305
# = 24-byte random nonce, so encrypting many secrets under one key is safe.
# (0.11 dropped the `std` feature; default alloc + getrandom is all we use.)
chacha20poly1305 = "0.11"
# Webhook HMAC-SHA256 signature verification (constant-time compare via subtle).
# hmac 0.13 + sha2 0.11 share digest 0.11.
hmac = "0.13"
sha2 = "0.11"
subtle = "2.6"
hex = "0.4"
cedar-policy = "4"
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "tokio1-rustls-tls",
    "builder",
    "hostname",
] }
# Held at 0.12: oauth2 5.0 (github oauth) links against reqwest 0.12 and its
# `AsyncHttpClient` impl only covers that version — bump the two together.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
oauth2 = { version = "5", default-features = false, features = [
    "reqwest",
    "rustls-tls",
] }

# web / tracing
axum = "0.8"
tower = { version = "0.5" }
tower-http = { version = "0.7", features = ["cors", "trace"] }
http = "1.4"
serde_json = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }


# cli
clap = { version = "4", features = ["derive", "env"] }

# logging
log = "0.4"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# doc-related: re-enable once we doc-pass the crates
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
# naming / repetition: too noisy in this layered codebase
module_name_repetitions = "allow"
struct_field_names = "allow"
similar_names = "allow"
# preference / style: not load-bearing
uninlined_format_args = "allow"
must_use_candidate = "allow"
# false-positive heavy in test stubs (Box<dyn Fn(...)> mocks)
type_complexity = "allow"
field_reassign_with_default = "allow"
# trait-impl plumbing sometimes returns Result on infallible paths
unnecessary_wraps = "allow"
# Copy-by-ref is sometimes deliberate for symmetry with trait signatures
trivially_copy_pass_by_ref = "allow"
# function-length budget judged case-by-case
too_many_lines = "allow"
# Option<Option<T>> is occasionally semantically meaningful (absent vs null)
option_option = "allow"
